<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #f0f0f0;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(135deg, black, #334155);
            color: white;
            position: sticky;
            top: 20px;
            border-radius: 15px;
            width: calc(100% - 40px);
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .header img {
            width: 100px;
            height: 50px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin: 30px auto;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(12, 14, 139, 0.1);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(12, 14, 139, 0.15);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(135deg, black, #334155);
        }

        .calendar-container {
            margin-bottom: 25px;
        }

        .calendar-container h2 {
            color: #0C0E8B;
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        #calendar {
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            padding: 15px;
            background: rgba(12, 14, 139, 0.05);
            border-radius: 12px;
            margin-top: 10px;
        }

        .order-section {
            padding: 20px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        .order-question {
            font-size: 1.3rem;
            color: #0C0E8B;
            margin-bottom: 25px;
            font-weight: 500;
            text-align: center;
        }

        .order-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .order-buttons button {
            padding: 12px 35px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .yes-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }

        .yes-btn:hover {
            background: linear-gradient(135deg, #20c997, #28a745);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.2);
        }

        .no-btn {
            background: linear-gradient(135deg, #dc3545, #f86b7d);
            color: white;
        }

        .no-btn:hover {
            background: linear-gradient(135deg, #f86b7d, #dc3545);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.2);
        }

        .location-selection {
            display: none;
            margin: 20px 0;
        }

        .location-title {
            font-size: 1.2rem;
            color: #0C0E8B;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .location-option {
            background: white;
            border: 2px solid #5BA7E1;
            color: #5BA7E1;
            padding: 15px 25px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .location-option:hover {
            background: #5BA7E1;
            color: white;
        }

        .location-option.selected {
            background: #5BA7E1;
            color: white;
        }

        .location-option i {
            font-size: 1.2rem;
        }

        #submitOrder {
            display: none;
            background: linear-gradient(135deg, #5BA7E1, #4a90e2);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(91, 167, 225, 0.2);
            width: 80%;
            max-width: 300px;
        }

        #submitOrder:hover {
            background: linear-gradient(135deg, #4a90e2, #5BA7E1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(91, 167, 225, 0.3);
        }

        #time-message {
            margin-top: 15px;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            font-weight: 500;
            display: none;
        }

        .thank-you-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: none;
            z-index: 1000;
            min-width: 300px;
        }

        .thank-you-container h2 {
            color: #0C0E8B;
            margin-bottom: 15px;
        }

        .thank-you-container p {
            color: #666;
            margin-bottom: 20px;
        }

        .thank-you-container i {
            color: #28a745;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            display: none;
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        .nav-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 20px 20px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.08);
            z-index: 90;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #94a3b8;
            transition: all 0.3s ease;
            cursor: pointer;
            flex: 1;
            position: relative;
            padding: 8px 0;
        }

        .nav-item.active {
            color: #334155;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #334155;
            border-radius: 50%;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 6px;
            transition: all 0.3s ease;
        }

        .nav-item:hover i {
            transform: translateY(-3px);
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item:hover span {
            color: #334155;
        }

        #qrcode {
            margin: 20px auto;
            padding: 10px;
            background: white;
            border-radius: 8px;
            width: fit-content;
        }

        .qr-instruction {
            color: #666;
            font-size: 0.9em;
            margin: 10px 0;
        }

        .download-btn {
            background: #0C0E8B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .download-btn:hover {
            background: #1416a0;
        }

        .location-display {
            margin: 10px 0;
            font-weight: 600;
            color: #0C0E8B;
        }

        .location-warning {
            background-color: rgba(255, 193, 7, 0.1);
            border: 2px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                width: 95%;
                padding: 20px;
            }

            .order-buttons {
                flex-direction: column;
                gap: 15px;
            }

            .order-buttons button {
                width: 100%;
            }

            .thank-you-container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>

    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
    authDomain: "suria-food-ordering-system.firebaseapp.com",
    projectId: "suria-food-ordering-system",
    storageBucket: "suria-food-ordering-system.firebasestorage.app",
    messagingSenderId: "204528329291",
    appId: "1:204528329291:web:cba270a2968e6d159963ce"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const submitButton = document.getElementById('submitOrder');
const thankYouMessage = document.getElementById('thankYouMessage');
const overlay = document.getElementById('overlay');
const loadingSpinner = document.getElementById('loadingSpinner');
const timeMessage = document.getElementById('time-message');
const calendarElement = document.getElementById('calendar');
const locationSelection = document.getElementById('locationSelection');
const selectedLocationText = document.getElementById('selectedLocationText');
const locationDisplay = document.getElementById('locationDisplay');
const locationWarning = document.getElementById('locationWarning');

let selectedLocation = null;

async function getCurrentServerTime() {
    try {
        const timestampRef = await addDoc(collection(db, "timestamps"), {
            timestamp: serverTimestamp()
        });
        const timestampDoc = await getDoc(timestampRef);
        const serverTime = timestampDoc.data().timestamp.toDate();
        await deleteDoc(timestampRef);
        return serverTime;
    } catch (error) {
        console.error("Error getting server time:", error);
        return new Date();
    }
}

function displayOrderInfo(location) {
    if (location) {
        selectedLocationText.textContent = location;
        locationDisplay.style.display = 'block';
    } else {
        locationDisplay.style.display = 'none';
    }
}

async function updateCalendarDisplay() {
    const today = await getCurrentServerTime();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    calendarElement.textContent = today.toLocaleDateString('en-US', options);
}

async function isOrderingTime() {
    const currentTime = await getCurrentServerTime();
    const morningStart = new Date(currentTime).setHours(4, 0, 0, 0);
    const morningEnd = new Date(currentTime).setHours(10, 0, 0, 0);
    const nightStart = new Date(currentTime).setHours(16, 0, 0, 0);
    const nightEnd = new Date(currentTime).setHours(21, 0, 0, 0);
    
    const isMorningShift = currentTime >= morningStart && currentTime <= morningEnd;
    const isNightShift = currentTime >= nightStart && currentTime <= nightEnd;
    
    return {
        isValid: isMorningShift || isNightShift,
        isMorningShift: isMorningShift,
        isNightShift: isNightShift
    };
}

function displayTimeMessage(message) {
    timeMessage.textContent = message;
    timeMessage.style.display = 'block';
}

function storeOrderData(orderData) {
    const orderToStore = {
        ...orderData,
        orderDate: orderData.orderDate && typeof orderData.orderDate.toDate === 'function' 
            ? orderData.orderDate.toDate().toISOString() 
            : orderData.orderDate,
        orderTimestamp: new Date().toISOString()
    };
    
    localStorage.setItem('orderData', JSON.stringify(orderToStore));
    localStorage.setItem('orderDate', new Date().toISOString());
}

async function isStoredOrderFromToday() {
    const storedDate = localStorage.getItem('orderDate');
    if (!storedDate) return false;

    const currentDate = await getCurrentServerTime();
    const storedDateTime = new Date(storedDate);

    return storedDateTime.getDate() === currentDate.getDate() &&
        storedDateTime.getMonth() === currentDate.getMonth() &&
        storedDateTime.getFullYear() === currentDate.getFullYear();
}

function clearStoredOrderData() {
    localStorage.removeItem('orderData');
    localStorage.removeItem('orderDate');
}

function setupLocationSelection() {
    const locationOptions = document.querySelectorAll('.location-option');

    // Reset location selection
    locationOptions.forEach(option => option.classList.remove('selected'));
    selectedLocation = null;
    submitButton.style.display = 'none';
    locationWarning.style.display = 'none';

    locationOptions.forEach(option => {
        option.addEventListener('click', () => {
            // Remove selection from all options
            locationOptions.forEach(opt => opt.classList.remove('selected'));

            // Select clicked option
            option.classList.add('selected');
            selectedLocation = option.dataset.location;

            // Show submit button only after location is selected
            submitButton.style.display = 'inline-block';
            timeMessage.style.display = 'none';
            locationWarning.style.display = 'none';

            console.log("Location selected:", selectedLocation);
        });
    });
}

function generateQRCode(data) {
    console.log("Generating QR code with data:", data);
    const qrContainer = document.getElementById('qrcode');
    
    if (!qrContainer) {
        console.error("QR code container not found!");
        return;
    }
    
    qrContainer.innerHTML = '';
    
    const qrData = {
        employeeId: data.employeeId || '',
        orderDate: typeof data.orderDate === 'string' ? data.orderDate : 
                (data.orderDate instanceof Date ? data.orderDate.toISOString() : 
                (data.orderDate && typeof data.orderDate.toDate === 'function' ? 
                    data.orderDate.toDate().toISOString() : new Date().toISOString())),
        orderTimestamp: data.orderTimestamp || new Date().toISOString(),
        orderStatus: data.orderStatus || 'ordered',
        location: data.location || ''
    };

    displayOrderInfo(data.location);

    try {
        new QRCode(qrContainer, {
            text: JSON.stringify(qrData),
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        
        const downloadBtn = document.getElementById('downloadQR');
        if (downloadBtn) {
            downloadBtn.style.display = 'block';
            downloadBtn.onclick = () => {
                const canvas = qrContainer.querySelector('canvas');
                if (canvas) {
                    const image = canvas.toDataURL("image/png");
                    const link = document.createElement('a');
                    link.href = image;
                    link.download = `order-qr-${new Date().getTime()}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            };
        }
    } catch (error) {
        console.error("Error generating QR code:", error);
    }
}

async function checkPreviousOrder(userID, collectionRef) {
    try {
        const todayStart = await getCurrentServerTime();
        todayStart.setHours(0, 0, 0, 0);
        const q = query(
            collectionRef, 
            where("userId", "==", userID),
            where("noEatingDate", ">=", todayStart)
        );
        const querySnapshot = await getDocs(q);
        return querySnapshot.empty;
    } catch (error) {
        console.error("Error checking previous entries:", error);
        return true;
    }
}

async function processOrder(userID) {
    try {
        // CRITICAL VALIDATION: Check if location is selected
        if (!selectedLocation || selectedLocation.trim() === '') {
            locationWarning.style.display = 'block';
            submitButton.style.display = 'none';
            alert("Please select your eating location before submitting your order.");
            return;
        }

        console.log("Processing order with location:", selectedLocation);

        const timeStatus = await isOrderingTime();
        if (!timeStatus.isValid) {
            alert("Order is closed. Please order between 4 AM - 10 AM or 4 PM - 9 PM.");
            return;
        }

        const hasNoPreviousOrder = await checkPreviousOrder(userID, collection(db, "orders"));
        if (!hasNoPreviousOrder) {
            alert("You have already placed an order today.");
            return;
        }

        overlay.style.display = 'block';
        loadingSpinner.style.display = 'block';

        const userDoc = await getDoc(doc(db, "users", userID));
        if (!userDoc.exists()) throw new Error("Could not get user info");

        const userData = userDoc.data();
        
        // CRITICAL: Ensure location is included in order details
        const orderDetails = {
            ...userData,
            orderDate: serverTimestamp(),
            userId: userID,
            orderStatus: "ordered",
            location: selectedLocation // This is required
        };

        // Double check location before submitting
        if (!orderDetails.location || orderDetails.location.trim() === '') {
            throw new Error("Location is required but was not provided");
        }

        console.log("Submitting order with details:", orderDetails);

        const orderRef = await addDoc(collection(db, "orders"), orderDetails);
        
        const orderSnapshot = await getDoc(orderRef);
        const orderWithTimestamp = {
            ...orderSnapshot.data(),
            id: orderRef.id
        };
        
        // Verify location was saved
        if (!orderWithTimestamp.location) {
            console.error("WARNING: Order was saved without location!");
        }

        thankYouMessage.style.display = 'block';
        generateQRCode(orderWithTimestamp);
        submitButton.style.display = 'none';
        locationSelection.style.display = 'none';
        storeOrderData(orderWithTimestamp);
    } catch (error) {
        console.error("Error processing order:", error);
        alert("There was an error processing your order. Please try again.");
        thankYouMessage.style.display = 'none';
    } finally {
        overlay.style.display = 'none';
        loadingSpinner.style.display = 'none';
    }
}

window.handleYesClick = async function() {
    const user = auth.currentUser;
    if (!user) {
        alert("Please log in to continue");
        return;
    }

    const timeStatus = await isOrderingTime();
    if (!timeStatus.isValid) {
        displayTimeMessage("Order is closed. Please order between 4 AM - 10 AM or 4 PM - 9 PM.");
        submitButton.style.display = 'none';
        locationSelection.style.display = 'none';
        return;
    }

    const hasNoPreviousOrder = await checkPreviousOrder(user.uid, collection(db, "orders"));
    if (!hasNoPreviousOrder) {
        displayTimeMessage("You have already placed an order today.");
        submitButton.style.display = 'none';
        locationSelection.style.display = 'none';
        return;
    }

    // Show location selection, but hide submit button until location is chosen
    locationSelection.style.display = 'block';
    submitButton.style.display = 'none';
    timeMessage.style.display = 'none';
    setupLocationSelection();
};

window.handleNoClick = async function() {
    const user = auth.currentUser;
    if (!user) {
        alert("Please log in to continue");
        return;
    }

    const timeStatus = await isOrderingTime();
    if (!timeStatus.isValid) {
        displayTimeMessage("'No Eating' submission is only available during ordering hours (4 AM - 10 AM, 4 PM - 9 PM).");
        return;
    }

    const noEatingCollection = collection(db, "noEating");
    const hasNoPreviousNoEating = await checkPreviousOrder(user.uid, noEatingCollection);
    
    if (!hasNoPreviousNoEating) {
        alert("You have already submitted a 'No Eating' entry today.");
        return;
    }

    const confirmDialog = document.createElement('div');
    confirmDialog.innerHTML = `
        <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;justify-content:center;align-items:center;">
            <div style="background:white;padding:20px;border-radius:10px;text-align:center;">
                <p style="margin-bottom:20px;">Are you sure you don't want to order food today?</p>
                <button id="confirmYes" style="margin:0 10px;padding:8px 16px;background:#4CAF50;color:white;border:none;border-radius:4px;cursor:pointer;">Yes</button>
                <button id="confirmNo" style="margin:0 10px;padding:8px 16px;background:#f44336;color:white;border:none;border-radius:4px;cursor:pointer;">No</button>
            </div>
        </div>
    `;
    
    document.body.appendChild(confirmDialog);

    const handleConfirmation = async (confirmed) => {
        if (confirmed) {
            try {
                overlay.style.display = 'block';
                loadingSpinner.style.display = 'block';

                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists()) throw new Error("Could not get user info");

                const userData = userDoc.data();
                const noEatingDetails = {
                    ...userData,
                    userId: user.uid,
                    noEatingDate: serverTimestamp()
                };

                await addDoc(noEatingCollection, noEatingDetails);
                alert('Thank you for letting us know!');
                window.location.href = 'home.html';
            } catch (error) {
                console.error("Error processing no eating option:", error);
                alert("There was an error. Please try again.");
            } finally {
                overlay.style.display = 'none';
                loadingSpinner.style.display = 'none';
            }
        }
        confirmDialog.remove();
    };

    confirmDialog.querySelector('#confirmYes').addEventListener('click', () => handleConfirmation(true));
    confirmDialog.querySelector('#confirmNo').addEventListener('click', () => handleConfirmation(false));
};

async function checkAndDisplayExistingOrder(userID) {
    if (await isStoredOrderFromToday()) {
        try {
            const orderDataString = localStorage.getItem('orderData');
            if (!orderDataString) {
                console.error("No order data found in localStorage");
                return false;
            }
            
            const orderData = JSON.parse(orderDataString);
            console.log("Retrieved order data from localStorage:", orderData);
            
            if (orderData && orderData.location) {
                thankYouMessage.style.display = 'block';
                submitButton.style.display = 'none';
                locationSelection.style.display = 'none';
                
                setTimeout(() => {
                    if (document.getElementById('qrcode')) {
                        generateQRCode(orderData);
                    } else {
                        console.error("QR code container not found!");
                    }
                }, 500);
            }
        } catch (error) {
            console.error("Error restoring order display:", error);
        }
    } else {
        console.log("No order from today found");
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    console.log("DOM content loaded");
    
    if (typeof QRCode === 'undefined') {
        console.error("QR Code library not loaded!");
        
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        script.onload = async () => {
            console.log("QR Code library loaded dynamically");
            await updateCalendarDisplay();
            auth.onAuthStateChanged((user) => {
                if (user) checkAndDisplayExistingOrder(user.uid);
            });
        };
        script.onerror = () => {
            console.error("Failed to load QR Code library dynamically");
        };
        document.head.appendChild(script);
    } else {
        await updateCalendarDisplay();
        auth.onAuthStateChanged((user) => {
            if (user) checkAndDisplayExistingOrder(user.uid);
        });
    }
});
