    <script>
        // Touch handling for sidebar
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const swipeDistance = touchEndX - touchStartX;
            
            if (swipeDistance < -50 && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
            else if (swipeDistance > 50 && !sidebar.classList.contains('active')) {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Set current date
        const currentDate = new Date().toLocaleDateString();
        document.getElementById('current-date').innerText = currentDate;

        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'home.html';
            const navItems = document.querySelectorAll('.nav-container .nav-item');
            
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            
            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (href === currentPage) {
                    item.classList.add('active');
                }
            });
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, onSnapshot, 
            collection, query, where, getDocs 
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
            authDomain: "suria-food-ordering-system.firebaseapp.com",
            projectId: "suria-food-ordering-system",
            storageBucket: "suria-food-ordering-system.firebasestorage.app",
            messagingSenderId: "204528329291",
            appId: "1:204528329291:web:cba270a2968e6d159963ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userDetails = document.querySelector('#userDetails');
        const nameinfo = document.querySelector('#nameinfo');

        // ===== USER INFO =====
        async function getUserInfoRealtime(userID) {
            const userDocRef = doc(db, "users", userID);
            onSnapshot(userDocRef, (doc) => {
                if (doc.exists()) {
                    const userInfo = doc.data();
                    nameinfo.innerHTML = `<div class="detail-item"><i class="fas fa-user"></i> <span>${userInfo.name}</span></div>`;
                    userDetails.innerHTML = `
                        <div class="detail-item"><i class="fas fa-user"></i> <span>${userInfo.name || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-user-friends"></i> <span>${userInfo.lastName || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-phone"></i> <span>${userInfo.phone || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-id-card"></i> <span>${userInfo.employeeId || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-building"></i> <span>${userInfo.department || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span>${userInfo.workSection || "Work section not set"}</span></div>
                    `;
                }
            });
        }

        // ===== NEW KY SUBMISSION FUNCTIONS =====
        async function getKYSubmissionsByMonth(userId) {
            try {
                const q = query(
                    collection(db, "ky_submission"),
                    where("submittedBy", "==", userId)
                );

                const querySnapshot = await getDocs(q);
                const submissions = [];
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let submissionDate = null;
                    
                    if (data.submittedDate) {
                        submissionDate = new Date(data.submittedDate);
                    } else if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                        submissionDate = data.createdAt.toDate();
                    }
                    
                    // Determine display status
                    let displayStatus = data.kyStatus || 'Open';
                    
                    submissions.push({
                        id: doc.id,
                        ...data,
                        submissionDate: submissionDate,
                        displayStatus: displayStatus
                    });
                });
                
                return submissions;
            } catch (error) {
                console.error("Error getting KY submissions:", error);
                return [];
            }
        }

        async function displayKYStats(userId) {
            const container = document.getElementById('kyStatsContent');
            
            try {
                const submissions = await getKYSubmissionsByMonth(userId);
                
                if (submissions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No KY submissions yet.</p>
                            <a href="kyform.html" style="color: #10b981; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 8px;">
                                Submit your first KY →
                            </a>
                        </div>
                    `;
                    return;
                }

                // Group submissions by month
                const monthlyData = {};
                submissions.forEach(sub => {
                    if (sub.submissionDate && !isNaN(sub.submissionDate.getTime())) {
                        const monthKey = sub.submissionDate.getFullYear() + '-' + 
                                       String(sub.submissionDate.getMonth() + 1).padStart(2, '0');
                        if (!monthlyData[monthKey]) {
                            monthlyData[monthKey] = [];
                        }
                        monthlyData[monthKey].push(sub);
                    }
                });

                // Get sorted months (most recent first)
                const sortedMonths = Object.keys(monthlyData).sort().reverse();
                const selectedMonth = sortedMonths[0];

                // Month names
                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const [year, monthNum] = selectedMonth ? selectedMonth.split('-') : ['', ''];
                const monthLabel = selectedMonth ? monthNames[parseInt(monthNum) - 1] + ' ' + year : 'N/A';
                
                // Get submissions for selected month
                const selectedSubmissions = monthlyData[selectedMonth] || [];
                const totalCount = selectedSubmissions.length;
                
                // Count statuses
                const openCount = selectedSubmissions.filter(s => s.displayStatus === 'Open' || s.displayStatus === 'open').length;
                const closeCount = selectedSubmissions.filter(s => s.displayStatus === 'Close' || s.displayStatus === 'close').length;
                const pendingCount = selectedSubmissions.filter(s => s.displayStatus === 'Pending' || s.displayStatus === 'pending').length;
                
                // Color based on count
                let colorClass = 'red';
                if (totalCount >= 2) colorClass = 'green';
                else if (totalCount >= 1) colorClass = 'yellow';

                // Build status summary
                let statusSummary = `
                    <div class="status-summary">
                        <div class="status-summary-item">
                            <div class="count total">${totalCount}</div>
                            <div class="label">📋 Total</div>
                        </div>
                        <div class="status-summary-item">
                            <div class="count open">${openCount}</div>
                            <div class="label">🔵 Open</div>
                        </div>
                        <div class="status-summary-item">
                            <div class="count close">${closeCount}</div>
                            <div class="label">✅ Close</div>
                        </div>
                    </div>
                `;

                // Build badge list (max 5 items)

        // ===== KAIZEN SUBMISSION FUNCTIONS =====
        async function getKaizenSubmissions(userId) {
            try {
                const q = query(
                    collection(db, "kaizen_submissions"),
                    where("submittedBy", "==", userId)
                );

                const querySnapshot = await getDocs(q);
                const submissions = [];
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let submissionDate = null;
                    
                    if (data.submittedDate) {
                        submissionDate = new Date(data.submittedDate);
                    } else if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                        submissionDate = data.createdAt.toDate();
                    }
                    
                    let displayStatus = 'pending';
                    if (data.adminStatus === 'approved') {
                        displayStatus = 'approved';
                    } else if (data.adminStatus === 'rejected') {
                        displayStatus = 'rejected';
                    }
                    
                    submissions.push({
                        id: doc.id,
                        ...data,
                        submissionDate: submissionDate,
                        displayStatus: displayStatus
                    });
                });
                
                return submissions;
            } catch (error) {
                console.error("Error getting Kaizen submissions:", error);
                return [];
            }
        }

        // ===== TRAININGS =====
        function displayJoinedTrainings(userId) {
            const container = document.getElementById('joinedTrainingsContent');
            
            try {
                onSnapshot(collection(db, 'trainings'), (trainingsSnap) => {
                    const timeDictionary = {};
                    trainingsSnap.forEach(doc => {
                        timeDictionary[doc.id] = doc.data().timeString || 'TBD'; 
                    });

                    const qAtt = query(collection(db, "training_attendance"), where("userId", "==", userId));
                    onSnapshot(qAtt, (snapAtt) => {
                        const attendedIds = [];
                        snapAtt.forEach(doc => attendedIds.push(doc.data().trainingId));

                        const qReg = query(collection(db, "training_registrations"), where("userId", "==", userId));
                        onSnapshot(qReg, (snap) => {
                            let trainings = [];
                            
                            const today = new Date();
                            today.setHours(0, 0, 0, 0); 
                            const currentMonth = today.getMonth();
                            const currentYear = today.getFullYear();

                            snap.forEach(doc => {
                                const data = doc.data();
                                const tDate = new Date(data.trainingDate);
                                
                                if (tDate >= today || (tDate.getMonth() === currentMonth && tDate.getFullYear() === currentYear)) {
                                    trainings.push(data);
                                }
                            });

                            if (trainings.length === 0) {
                                container.innerHTML = `<div class="detail-item" style="justify-content: center; color: #999;">No upcoming trainings scheduled.</div>`;
                                return;
                            }

                            trainings.sort((a, b) => new Date(a.trainingDate) - new Date(b.trainingDate));

                            let html = "";
                            trainings.forEach(t => {
                                const niceDate = new Date(t.trainingDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                                const exactTime = timeDictionary[t.trainingId] || 'TBD';
                                const hasAttended = attendedIds.includes(t.trainingId);
                                
                                const statusBadge = hasAttended 
                                    ? `<span style="background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: auto;">✅ Checked In</span>` 
                                    : `<span style="background: #64748b; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: auto;">⏳ Upcoming</span>`;
                                
                                html += `
                                    <div class="training-item">
                                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                            <h4>${t.trainingName}</h4>
                                            ${statusBadge}
                                        </div>
                                        <p>
                                            <span><i class="far fa-calendar-alt"></i> ${niceDate}</span> 
                                            <span style="margin-left: 10px;"><i class="far fa-clock"></i> ${exactTime}</span>
                                        </p>
                                    </div>
                                `;
                            });
                            
                            container.innerHTML = html;
                        });
                    });
                });
            } catch (error) {
                console.error("Error setting up training listener:", error);
                container.innerHTML = `<div class="detail-item" style="justify-content: center; color: #ef4444;">Error loading your schedule.</div>`;
            }
        }
