<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete Mobile App</title>
    <style>
* {margin: 0;padding: 0;box-sizing: border-box;}
body {font-family: 'Helvetica', sans-serif;background-color: #f0f0f0;overflow-x: hidden;padding-bottom: 100px;min-height: 100vh;}
.container {max-width: 500px;margin: 0 auto;padding: 0 20px;}
.header {display: flex;align-items: center;padding: 15px 20px;background: linear-gradient(135deg, black, #334155);color: white;position: sticky;top: 20px;border-radius: 15px;width: calc(100% - 40px);margin: 20px auto;max-width: 500px;box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);z-index: 100;}
.menu-icon {font-size: 30px;cursor: pointer;}
.header img {width: 100px;height: 50px;margin-left: auto;margin-right: auto;}
.sidebar {position: fixed;top: 0;left: -300px;width: 300px;height: 100vh;background: linear-gradient(135deg, black, #334155);color: white;transition: all 0.3s ease;z-index: 1000;padding: 30px;box-shadow: 5px 0 15px rgba(0, 0, 0, 0.2);}
.sidebar.active {left: 0;}
.sidebar-header {display: flex;align-items: center;margin-bottom: 30px;padding-bottom: 20px;border-bottom: 1px solid rgba(255, 255, 255, 0.1);}
.sidebar img {width: 120px;margin-right: 15px;}
.sidebar .user-info {background: rgba(255, 255, 255, 0.1);padding: 15px;border-radius: 10px;margin-bottom: 30px;}
.sidebar .user-info p {margin: 5px 0;font-size: 0.9em;}
.sidebar-menu {display: flex;flex-direction: column;gap: 15px;}
.sidebar a {color: white;text-decoration: none;font-size: 16px;padding: 12px 15px;border-radius: 8px;transition: all 0.3s ease;display: flex;align-items: center;gap: 10px;}
.sidebar a:hover {background: rgba(255, 255, 255, 0.1);transform: translateX(5px);}
.profile-container {width: 100%;max-width: 450px;margin: 0 auto;background-color: #1f1f1f;border-radius: 20px;overflow: hidden;background-size: fill;}
.header-background img {width: 100%;height: 180px;object-fit: cover;}
.profile-pic-container {display: flex;justify-content: center;margin-top: -50px;background-color: transparent;}
.profile-pic {width: 100px;height: 100px;margin-top: 75px;margin-bottom: 50px;border-radius: 50%;background-color: white;border: 4px solid #1f1f1f;background-image: url('https://storage.googleapis.com/flutterflow-io-6f20.appspot.com/projects/travel-app-qq7yrm/assets/xw4qknuighs9/User-Profile-PNG-High-Quality-Image.png');background-size: cover;background-position: center;}
.profile-section {background-color: #333;padding: 20px;border-radius: 10px;margin: 20px;color: #fff;}
.section-header {font-size: 18px;font-weight: bold;margin-bottom: 15px;color: #fff;}
.detail-item {display: flex;align-items: center;background-color: #444;padding: 10px 15px;border-radius: 6px;margin-bottom: 10px;width: 100%;}
.detail-item i {color: #fff;font-size: 18px;margin-right: 10px;}
.detail-item span {font-size: 16px;color: #ddd;}
.training-item {background-color: #444;padding: 15px;border-radius: 8px;margin-bottom: 10px;border-left: 4px solid #10b981;display: flex;flex-direction: column;gap: 8px;}
.training-item h4 {color: #fff;font-size: 15px;font-weight: bold;}
.training-item p {color: #ddd;font-size: 13px;display: flex;align-items: center;gap: 8px;}
.training-item p i {color: #10b981; width: 14px; text-align: center;}
.ky-stats-card {background-color: #333;padding: 20px;border-radius: 10px;margin: 20px;color: #fff;}
.stats-header {font-size: 18px;font-weight: bold;margin-bottom: 20px;color: #fff;display: flex;align-items: center;gap: 10px;}
.stats-header i {color: #0C0E8B;font-size: 24px;}
.stats-content {display: flex;flex-direction: column;gap: 15px;}
.stat-row {display: flex;justify-content: space-between;align-items: center;background-color: #444;padding: 15px;border-radius: 8px;}
.stat-label {font-size: 14px;color: #ddd;}
.stat-value {font-size: 28px;font-weight: bold;padding: 8px 16px;border-radius: 8px;min-width: 80px;text-align: center;}
.stat-value.red {background-color: #ef4444;color: white;animation: pulse-red 2s infinite;}
.stat-value.green {background-color: #22c55e;color: white;}
@keyframes pulse-red {0%, 100% { opacity: 1; }50% { opacity: 0.7; }}
.stat-info {font-size: 12px;color: #999;margin-top: 10px;padding: 10px;background-color: #444;border-radius: 6px;text-align: center;}
.loading-stats {text-align: center;padding: 20px;color: #999;}
.nav-container {position: fixed;bottom: 0;left: 0;width: 100%;background: white;padding: 15px 20px 20px;display: flex;justify-content: space-between;box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.08);z-index: 90;border-top-left-radius: 20px;border-top-right-radius: 20px;}
.nav-item {display: flex;flex-direction: column;align-items: center;text-decoration: none;color: #94a3b8;transition: all 0.3s ease;cursor: pointer;flex: 1;position: relative;padding: 8px 0;}
.nav-item.active {color: #334155;}
.nav-item.active::before {content: '';position: absolute;top: -15px;left: 50%;transform: translateX(-50%);width: 5px;height: 5px;background: #334155;border-radius: 50%;}
.nav-item i {font-size: 20px;margin-bottom: 6px;transition: all 0.3s ease;}
.nav-item:hover i {transform: translateY(-3px);}
.nav-item span {font-size: 12px;font-weight: 500;transition: all 0.3s ease;}
.nav-item:hover span {color: #334155;}
.overlay {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0, 0, 0, 0.5);opacity: 0;visibility: hidden;transition: all 0.3s ease;z-index: 999;}
.overlay.active {opacity: 1;visibility: visible;}
a {text-decoration: none;}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

            </div>

    <script>
        // Touch handling for sidebar
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const swipeDistance = touchEndX - touchStartX;
            
            if (swipeDistance < -50 && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
            else if (swipeDistance > 50 && !sidebar.classList.contains('active')) {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Set current date
        const currentDate = new Date().toLocaleDateString();
        document.getElementById('current-date').innerText = currentDate;

        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'home.html';
            const navItems = document.querySelectorAll('.nav-container .nav-item');
            
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            
            navItems.forEach(item => {
                const href = item.getAttribute('href');
                if (href === currentPage) {
                    item.classList.add('active');
                }
            });
        });
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { 
            getFirestore, doc, getDoc, onSnapshot, 
            collection, query, where, getDocs 
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        // Maintained Suria configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
            authDomain: "suria-food-ordering-system.firebaseapp.com",
            projectId: "suria-food-ordering-system",
            storageBucket: "suria-food-ordering-system.firebasestorage.app",
            messagingSenderId: "204528329291",
            appId: "1:204528329291:web:cba270a2968e6d159963ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const userDetails = document.querySelector('#userDetails');
        const nameinfo = document.querySelector('#nameinfo');

        // Real-time update for user info
        async function getUserInfoRealtime(userID) {
            const userDocRef = doc(db, "users", userID);
            onSnapshot(userDocRef, (doc) => {
                if (doc.exists()) {
                    const userInfo = doc.data();
                    
                    nameinfo.innerHTML = `<div class="detail-item"><i class="fas fa-user"></i> <span>${userInfo.name}</span></div>`;
                    
                    userDetails.innerHTML = `
                        <div class="detail-item"><i class="fas fa-user"></i> <span>${userInfo.name || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-user-friends"></i> <span>${userInfo.lastName || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-phone"></i> <span>${userInfo.phone || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-id-card"></i> <span>${userInfo.employeeId || "N/A"}</span></div>
                        <div class="detail-item"><i class="fas fa-building"></i> <span>${userInfo.department || "N/A"}</span></div>
                    `;
                }
            });
        }

        // Function to get KY submissions count for current month
        async function getKYSubmissionsCount(userId) {
            try {
                const q = query(
                    collection(db, "she-kikenYochi"),
                    where("submittedBy", "==", userId)
                );

                const querySnapshot = await getDocs(q);
                
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                
                let monthCount = 0;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let submissionDate = null;
                    
                    if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                        submissionDate = data.createdAt.toDate();
                    } else if (data.submittedDate) {
                        submissionDate = new Date(data.submittedDate);
                    }
                    
                    if (submissionDate && !isNaN(submissionDate.getTime())) {
                        const subMonth = submissionDate.getMonth();
                        const subYear = submissionDate.getFullYear();
                        
                        if (subMonth === currentMonth && subYear === currentYear) {
                            monthCount++;
                        }
                    }
                });
                return monthCount;
            } catch (error) {
                console.error("Error getting KY submissions:", error);
                return 0;
            }
        }

        // Function to display KY stats initially
        async function displayKYStats(userId) {
            const kyStatsContent = document.getElementById('kyStatsContent');
            
            try {
                const count = await getKYSubmissionsCount(userId);
                const colorClass = count < 2 ? 'red' : 'green';
                const monthName = new Date().toLocaleString('default', { month: 'long', year: 'numeric' });
                
                kyStatsContent.innerHTML = `
                    <div class="stat-row">
                        <div><div class="stat-label">${monthName}</div></div>
                        <div class="stat-value ${colorClass}">${count}/2</div>
                    </div>
                    <div class="stat-info">
                        <i class="fas fa-info-circle"></i> Minimum required: 2 submissions per month
                    </div>
                `;
            } catch (error) {
                kyStatsContent.innerHTML = `
                    <div class="stat-row">
                        <div class="stat-label">Error loading statistics</div>
                    </div>
                `;
            }
        }

        // Updated Function: Monthly Filter + Checked-in Status
        // Updated Function: Real-Time Listener + Shows All Upcoming Trainings
function displayJoinedTrainings(userId) {
    const container = document.getElementById('joinedTrainingsContent');
    
    try {
        // 1. Listen to the master Trainings list for accurate times in real-time
        onSnapshot(collection(db, 'trainings'), (trainingsSnap) => {
            const timeDictionary = {};
            trainingsSnap.forEach(doc => {
                timeDictionary[doc.id] = doc.data().timeString || 'TBD'; 
            });

            // 2. Listen to actual check-in attendances in real-time
            const qAtt = query(collection(db, "training_attendance"), where("userId", "==", userId));
            onSnapshot(qAtt, (snapAtt) => {
                const attendedIds = [];
                snapAtt.forEach(doc => attendedIds.push(doc.data().trainingId));

                // 3. Listen to user's registered list in real-time
                const qReg = query(collection(db, "training_registrations"), where("userId", "==", userId));
                onSnapshot(qReg, (snap) => {
                    let trainings = [];
                    
                    // Get today's date and set it to midnight to ensure accurate day tracking
                    const today = new Date();
                    today.setHours(0, 0, 0, 0); 
                    const currentMonth = today.getMonth();
                    const currentYear = today.getFullYear();

                    snap.forEach(doc => {
                        const data = doc.data();
                        const tDate = new Date(data.trainingDate);
                        
                        // FIX: Include trainings from this month OR any future upcoming date
                        if (tDate >= today || (tDate.getMonth() === currentMonth && tDate.getFullYear() === currentYear)) {
                            trainings.push(data);
                        }
                    });

                    if (trainings.length === 0) {
                        container.innerHTML = `<div class="detail-item" style="justify-content: center; color: #999;">No upcoming trainings scheduled.</div>`;
                        return;
                    }

                    // Sort by date (earliest to latest)
                    trainings.sort((a, b) => new Date(a.trainingDate) - new Date(b.trainingDate));

                    let html = "";
                    trainings.forEach(t => {
                        const niceDate = new Date(t.trainingDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                        const exactTime = timeDictionary[t.trainingId] || 'TBD';
                        const hasAttended = attendedIds.includes(t.trainingId);
                        
                        const statusBadge = hasAttended 
                            ? `<span style="background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: auto;">✅ Checked In</span>` 
                            : `<span style="background: #64748b; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: auto;">⏳ Upcoming</span>`;
                        
                        html += `
                            <div class="training-item">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <h4>${t.trainingName}</h4>
                                    ${statusBadge}
                                </div>
                                <p>
                                    <span><i class="far fa-calendar-alt"></i> ${niceDate}</span> 
                                    <span style="margin-left: 10px;"><i class="far fa-clock"></i> ${exactTime}</span>
                                </p>
                            </div>
                        `;
                    });
                    
                    container.innerHTML = html;
                });
            });
        });
    } catch (error) {
        console.error("Error setting up training listener:", error);
        container.innerHTML = `<div class="detail-item" style="justify-content: center; color: #ef4444;">Error loading your schedule.</div>`;
    }
}

        // Get logged-in user and display info + KY stats + Trainings
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                getUserInfoRealtime(user.uid);
                await displayKYStats(user.uid);
                displayJoinedTrainings(user.uid); // Removed the "await" here

                // Set up real-time updates for KY stats
                const kyQuery = query(
                    collection(db, "she-kikenYochi"),
                    where("submittedBy", "==", user.uid)
                );

                onSnapshot(kyQuery, (snapshot) => {
                    const now = new Date();
                    const currentMonth = now.getMonth();
                    const currentYear = now.getFullYear();
                    
                    let count = 0;
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        let submissionDate = null;
                        
                        if (data.createdAt && typeof data.createdAt.toDate === 'function') {
                            submissionDate = data.createdAt.toDate();
                        } else if (data.submittedDate) {
                            submissionDate = new Date(data.submittedDate);
                        }
                        
                        if (submissionDate && !isNaN(submissionDate.getTime())) {
                            if (submissionDate.getMonth() === currentMonth && submissionDate.getFullYear() === currentYear) {
                                count++;
                            }
                        }
                    });
                    
                    const colorClass = count < 2 ? 'red' : 'green';
                    const monthName = new Date().toLocaleString('default', { month: 'long', year: 'numeric' });
                    
                    document.getElementById('kyStatsContent').innerHTML = `
                        <div class="stat-row">
                            <div><div class="stat-label">${monthName}</div></div>
                            <div class="stat-value ${colorClass}">${count}/2</div>
                        </div>
                        <div class="stat-info">
                            <i class="fas fa-info-circle"></i> Minimum required: 2 submissions per month
                        </div>
                    `;
                });
            } else {
                nameinfo.innerHTML = `<p>Please log in</p>`;
                userDetails.innerHTML = `<p>Please log in</p>`;
                document.getElementById('kyStatsContent').innerHTML = '<p>Please log in to view statistics</p>';
                document.getElementById('joinedTrainingsContent').innerHTML = '<p>Please log in to view schedule</p>';
            }
        });
    </script>
