<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claimed Orders - Canteen Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="auth-guard.js"></script>
    <style>
        :root {
            --primary-color: #454545;
            --primary-hover: #2f2f2f;
            --secondary-color: #2dd4bf;
            --secondary-hover: #14b8a6;
            --background-color: #f4f4f5;
            --surface-color: #ffffff;
            --white: #ffffff;
            --text-main: #27272a;
            --text-muted: #71717a;
            --border-color: #e4e4e7;
            --radius-lg: 15px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
            --claimed-bg: #ecfdf5;
            --claimed-border: #a7f3d0;
            --claimed-text: #065f46;
            --unclaimed-bg: #fff1f2;
            --unclaimed-border: #fecdd3;
            --unclaimed-text: #9f1239;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; background: var(--background-color); }
        body {
            min-height: 100vh;
            padding-bottom: 120px;
            background: radial-gradient(circle at 15% 0%, rgba(69, 69, 69, 0.05) 0, transparent 38%), var(--background-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .header {
            position: fixed;
            inset: 0 0 auto 0;
            height: 68px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
        }
        .header img { max-height: 44px; width: auto; object-fit: contain; }

        .container {
            width: min(calc(100% - 32px), 1140px);
            margin: 0 auto;
            padding-top: 88px;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 20px 24px;
            margin-bottom: 18px;
        }

        /* Filter Controls */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }

        input[type="date"], select, textarea {
            width: 100%;
            min-height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            background: #ffffff;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.92rem;
            padding: 0 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.14);
        }

        /* Multi-Select Department Dropdown */
        .dropdown-container { position: relative; width: 100%; }
        .dropdown-toggle {
            width: 100%;
            min-height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-md);
            background: #ffffff;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.92rem;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .dropdown-toggle:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.14);
        }
        .dropdown-menu-custom {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            max-height: 240px;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            z-index: 100;
            display: none;
            padding: 8px;
        }
        .dropdown-menu-custom.show { display: block; }
        .dropdown-item-custom {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 6px;
            color: var(--text-main);
        }
        .dropdown-item-custom:hover { background: #f8fafc; }
        .dropdown-item-custom input {
            accent-color: var(--secondary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .select-all-row {
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 4px;
            padding-bottom: 8px;
            font-weight: 700;
        }

        /* Pill Button Groups (dept quick filter + time filter) */
        .group-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .pill-group {
            display: inline-flex;
            background: #f1f5f4;
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
            flex-wrap: wrap;
        }
        .pill-btn {
            border: 0;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            background: transparent;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .pill-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-primary {
            background: var(--primary-color);
            color: #ffffff;
            padding: 10px 20px;
            border: 0;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.97); }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-card .label {
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-top: 4px;
        }
        .stat-card.claimed .value { color: #059669; }
        .stat-card.unclaimed .value { color: #dc2626; }
        .stat-card.diet .value { color: #b45309; }
        .stat-card.rate .value { color: var(--secondary-hover); font-size: 1.4rem; }

        /* Table Design */
        .table-card { padding: 0; overflow: hidden; }
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; min-width: 900px; border-collapse: collapse; text-align: left; }
        thead th {
            background: var(--primary-color);
            color: #ffffff;
            font-size: 0.84rem;
            font-weight: 700;
            padding: 13px 14px;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.88rem;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:nth-child(even) { background-color: #f8fafc; }
        tbody tr:hover { background: #f0fdfa; transition: background-color 0.2s ease; }

        .location-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.78em;
            font-weight: 600;
            text-transform: uppercase;
        }
        .location-pekan { background-color: #dbeafe; color: #1e40af; }
        .location-kristal { background-color: #fce7f3; color: #be185d; }
        .location-unspecified { background-color: #f3f4f6; color: #6b7280; }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .badge-status.claimed {
            background: var(--claimed-bg);
            border: 1px solid var(--claimed-border);
            color: var(--claimed-text);
        }
        .badge-status.unclaimed {
            background: var(--unclaimed-bg);
            border: 1px solid var(--unclaimed-border);
            color: var(--unclaimed-text);
        }

        .badge-diet {
            background: #fef3c7;
            color: #92400e;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.78rem;
            border: 1px solid #fde68a;
        }

        .send-card h3 { font-size: 1.05rem; font-weight: 750; color: var(--primary-color); margin-bottom: 10px; }
        .send-card textarea { min-height: 90px; margin-bottom: 12px; resize: vertical; }
        #sendButton { }

        /* Bottom Navigation (Suria) */
        .nav-container {position: fixed;bottom: 20px;left: 50%;transform: translateX(-50%);background: var(--primary-color);padding: 15px 30px;border-radius: 30px;box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);display: flex;align-items: center;justify-content: space-around;gap: 35px;width: calc(100% - 40px);max-width: 1200px;z-index: 1000;}
        .nav-item {color: var(--white);text-decoration: none;display: flex;flex-direction: column;align-items: center;gap: 5px;}
        .nav-item i {font-size: 20px;}
        .nav-item span {font-size: 12px;}

        @media (max-width: 768px) {
            .container { padding-top: 76px; }
            .card { padding: 16px; }
            .action-row { flex-direction: column; align-items: stretch; }
            .pill-group { width: 100%; justify-content: center; }
            .btn-primary { width: 100%; justify-content: center; }
            thead th, tbody td { padding: 10px 8px; font-size: 12px; }
            .location-badge { font-size: 0.7em; padding: 3px 8px; }
            .nav-item span { display: none; }
            .nav-container { gap: 15px; padding: 12px 20px; }
        }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            query,
            where,
            onSnapshot,
            Timestamp,
            getDocs,
            addDoc
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
            authDomain: "suria-food-ordering-system.firebaseapp.com",
            projectId: "suria-food-ordering-system",
            storageBucket: "suria-food-ordering-system.firebasestorage.app",
            messagingSenderId: "204528329291",
            appId: "1:204528329291:web:cba270a2968e6d159963ce"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersRef = collection(db, "orders");

        // --- Department quick-filter groups (existing Suria setup) ---
        const stampingDepartments = ['PROD-STAMPING', 'PPIC-STAMPING', 'PROD-STAMPING-DIEMTCE'];
        const mainCanteenDepartments = ['IT', 'HCD', 'PROD', 'PPIC', 'QC', 'PURCH', 'MKTG', 'ME', 'ED', 'FNA', 'ENG', 'MDO', 'SHE', 'TPS', 'QA'];
        const totalsdepart = ['IT', 'HCD', 'PROD', 'PPIC', 'QC', 'PURCH', 'MKTG', 'ME', 'ED', 'FNA', 'ENG', 'MDO', 'SHE', 'TPS', 'QA', 'PROD-STAMPING', 'PPIC-STAMPING', 'PROD-STAMPING-DIEMTCE', 'NPSB'];
        // Static fallback list, used only if no departments can be loaded dynamically from Firestore
        const fallbackDepartments = ['HRA', 'FNA', 'MDO', 'BD&Project', 'SALES', 'PVD', 'SPECIAL PROJECT', 'QMS', 'QAQC', 'PE/LPS', 'MAINTENANCE', 'PROD', 'PPCL', 'SYNERGY', 'SGTSB'];

        let allSystemDepartments = [];
        let rawSnapshotOrders = [];
        let cachedClaimedMap = new Map();
        let currentUnsubscribe = null;

        // --- LOCATION BADGE HELPER ---
        function getLocationBadge(location) {
            if (!location) return '<span class="location-badge location-unspecified">Not Specified</span>';

            const cleanLoc = String(location).trim().toUpperCase();

            if (cleanLoc === 'PEKAN SUBANG') {
                return '<span class="location-badge location-pekan">PEKAN SUBANG</span>';
            } else if (cleanLoc === 'SUBANG KRISTAL') {
                return '<span class="location-badge location-kristal">SUBANG KRISTAL</span>';
            }

            return `<span class="location-badge" style="background-color: #e5e7eb; color: #374151;">${cleanLoc}</span>`;
        }

        // --- CLAIM TIME FORMATTER ---
        function formatClaimTime(claimMeta) {
            if (!claimMeta) return '';
            if (claimMeta.timestamp) {
                return claimMeta.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
            }
            if (claimMeta.scannedTime) {
                let t = String(claimMeta.scannedTime).trim();
                if (t.includes('.')) {
                    const parts = t.split('.');
                    if (parts.length >= 2) {
                        let h = parseInt(parts[0], 10);
                        const m = parts[1];
                        if (!isNaN(h)) {
                            const ampm = h >= 12 ? 'PM' : 'AM';
                            h = h % 12 || 12;
                            return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
                        }
                    }
                }
                return t;
            }
            return 'Claimed';
        }

        // --- FETCH CLAIMED ORDERS (with claim time metadata) ---
        async function fetchClaimedMap(dateStr, startOfDay, endOfDay) {
            const claimedRef = collection(db, "claimed");
            const [snapByTimestamp, snapByDateStr] = await Promise.all([
                getDocs(query(claimedRef, where("timestamp", ">=", Timestamp.fromDate(startOfDay)), where("timestamp", "<=", Timestamp.fromDate(endOfDay)))),
                getDocs(query(claimedRef, where("scannedDate", "==", dateStr)))
            ]);

            const map = new Map();
            const parseDoc = (d) => {
                const data = d.data();
                if (!data.employeeId) return;
                const empId = String(data.employeeId).trim();
                map.set(empId, {
                    scannedTime: data.scannedTime || null,
                    timestamp: data.timestamp || null
                });
            };

            snapByTimestamp.forEach(parseDoc);
            snapByDateStr.forEach(parseDoc);
            return map;
        }

        // --- ACTIVE DIET PROFILES (Permanent Setup from Epoch Start) ---
        async function getActiveDietEmpIds() {
            const epochStart = new Date('2026-06-22T00:00:00+08:00');
            const activeDietQuery = query(
                collection(db, "fit_program_users"),
                where("registeredAt", ">=", Timestamp.fromDate(epochStart))
            );
            const activeDietSnap = await getDocs(activeDietQuery);
            const activeDietEmpIds = new Set();
            activeDietSnap.forEach(doc => {
                activeDietEmpIds.add(String(doc.data().employeeId).trim());
            });
            return activeDietEmpIds;
        }

        // --- DEPARTMENTS (dynamic, with static fallback) ---
        async function fetchAllDepartments() {
            const deptsSet = new Set();
            try {
                const usersSnap = await getDocs(collection(db, 'users'));
                usersSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.department) deptsSet.add(String(data.department).trim());
                });
            } catch (err) {
                console.error("Error fetching departments from users:", err);
            }
            if (deptsSet.size === 0) {
                fallbackDepartments.forEach(d => deptsSet.add(d));
            }
            return Array.from(deptsSet).sort();
        }

        function renderDepartmentCheckboxes() {
            const container = document.getElementById('deptCheckboxesList');
            if (!container) return;

            container.innerHTML = '';
            allSystemDepartments.forEach(dept => {
                const item = document.createElement('div');
                item.className = 'dropdown-item-custom';
                item.innerHTML = `
                    <label style="display:flex; align-items:center; gap:10px; width:100%; cursor:pointer;">
                        <input type="checkbox" class="dept-checkbox" value="${dept}" checked> ${dept}
                    </label>
                `;
                container.appendChild(item);
            });

            document.querySelectorAll('.dept-checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    clearGroupButtons();
                    updateSelectAllState();
                    processAndRenderOrders();
                });
            });

            const selectAll = document.getElementById('selectAllDepts');
            if (selectAll) selectAll.checked = true;

            updateSelectAllState();
        }

        function updateSelectAllState() {
            const checkboxes = document.querySelectorAll('.dept-checkbox');
            const selectAll = document.getElementById('selectAllDepts');
            const toggleText = document.getElementById('deptToggleText');

            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            const totalCount = checkboxes.length;

            if (checkedCount === totalCount && totalCount > 0) {
                if (selectAll) { selectAll.checked = true; selectAll.indeterminate = false; }
                toggleText.textContent = "All Departments";
            } else if (checkedCount === 0) {
                if (selectAll) { selectAll.checked = false; selectAll.indeterminate = false; }
                toggleText.textContent = "No Department Selected";
            } else {
                if (selectAll) { selectAll.checked = false; selectAll.indeterminate = true; }
                toggleText.textContent = `${checkedCount} Department(s) Selected`;
            }
        }

        function clearGroupButtons() {
            document.getElementById('stampingBtn').classList.remove('active');
            document.getElementById('mainCanteenBtn').classList.remove('active');
            document.getElementById('totalBtn').classList.remove('active');
        }

        function applyGroupSelection(list) {
            const checkboxes = document.querySelectorAll('.dept-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = list.includes(cb.value);
            });
            updateSelectAllState();
            processAndRenderOrders();
        }

        // --- CORE FILTER + RENDER ---
        function processAndRenderOrders() {
            const selectedDeptCheckboxes = document.querySelectorAll('.dept-checkbox:checked');
            const selectedDepts = new Set(Array.from(selectedDeptCheckboxes).map(cb => cb.value));
            const selectedLocation = document.getElementById('locationFilter').value;
            const claimStatus = document.getElementById('claimStatusFilter').value;
            const mealType = document.getElementById('mealTypeFilter').value;

            let totalCount = 0;
            let claimedCount = 0;
            let unclaimedCount = 0;
            let claimedDietCount = 0;
            let unclaimedDietCount = 0;
            const finalRows = [];

            rawSnapshotOrders.forEach(item => {
                const order = item.order;
                const dept = String(order.department || '').trim();
                if (!selectedDepts.has(dept)) return;

                if (selectedLocation) {
                    const selLoc = selectedLocation.trim().toUpperCase();
                    if (String(order.location || '').trim().toUpperCase() !== selLoc) return;
                }

                const empId = item.empId;
                const isClaimed = cachedClaimedMap.has(empId);
                const claimMeta = cachedClaimedMap.get(empId);
                const isDiet = item.isDiet;

                totalCount++;
                if (isClaimed) claimedCount++; else unclaimedCount++;
                if (isDiet) {
                    if (isClaimed) claimedDietCount++; else unclaimedDietCount++;
                }

                if (claimStatus === 'claimed' && !isClaimed) return;
                if (claimStatus === 'unclaimed' && isClaimed) return;
                if (mealType === 'diet' && !isDiet) return;
                if (mealType === 'regular' && isDiet) return;

                finalRows.push({ order, empId, isClaimed, claimMeta, mealLabel: item.mealLabel, isDiet });
            });

            document.getElementById('statTotal').textContent = totalCount;
            document.getElementById('statClaimed').textContent = claimedCount;
            document.getElementById('statUnclaimed').textContent = unclaimedCount;
            document.getElementById('statClaimedDiet').textContent = claimedDietCount;
            document.getElementById('statUnclaimedDiet').textContent = unclaimedDietCount;
            const rate = totalCount > 0 ? ((claimedCount / totalCount) * 100).toFixed(1) : 0;
            document.getElementById('statRate').textContent = `${rate}%`;

            const tbody = document.querySelector('#orderTable tbody');
            tbody.innerHTML = '';

            if (finalRows.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 32px; color: var(--text-muted);">
                            No orders found for the selected criteria
                        </td>
                    </tr>
                `;
                return;
            }

            finalRows.forEach((item, index) => {
                const tr = document.createElement('tr');
                const orderTime = item.order.orderDate.toDate();
                const formattedTime = orderTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const formattedClaimTime = item.isClaimed ? formatClaimTime(item.claimMeta) : '';

                tr.innerHTML = `
                    <td style="text-align: center; color: var(--text-muted);">${index + 1}</td>
                    <td><strong>${item.order.name || 'N/A'}</strong></td>
                    <td>${item.empId}</td>
                    <td>${item.order.department || 'N/A'}</td>
                    <td>${getLocationBadge(item.order.location)}</td>
                    <td>${item.order.orderStatus || 'Pending'}</td>
                    <td>${formattedTime}</td>
                    <td>${item.isDiet ? `<span class="badge-diet"><i class="fas fa-leaf"></i> ${item.mealLabel}</span>` : item.mealLabel}</td>
                    <td style="text-align: center;">
                        ${item.isClaimed
                            ? `<span class="badge-status claimed"><i class="fas fa-check-circle"></i> Claimed (${formattedClaimTime})</span>`
                            : `<span class="badge-status unclaimed"><i class="fas fa-clock"></i> Not Yet</span>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- DATA LOAD (per date + time-of-day window) ---
        async function loadData() {
            const selectedDate = document.getElementById('datePicker').value;
            if (!selectedDate) {
                alert("Please select a date");
                return;
            }

            const startOfDay = new Date(selectedDate);
            startOfDay.setHours(0, 0, 0, 0);
            const endOfDay = new Date(selectedDate);
            endOfDay.setHours(23, 59, 59, 999);

            let timeStart = new Date(selectedDate);
            let timeEnd = new Date(selectedDate);

            const morningTimeBtn = document.getElementById('morningTimeBtn');
            const eveningTimeBtn = document.getElementById('eveningTimeBtn');

            if (morningTimeBtn.classList.contains('active')) {
                timeStart.setHours(4, 0, 0, 0);
                timeEnd.setHours(10, 0, 0, 0);
            } else if (eveningTimeBtn.classList.contains('active')) {
                timeStart.setHours(16, 0, 0, 0);
                timeEnd.setHours(21, 0, 0, 0);
            } else {
                timeStart.setHours(0, 0, 0, 0);
                timeEnd.setHours(23, 59, 59, 999);
            }

            try {
                const [claimedMap, activeDietEmpIds] = await Promise.all([
                    fetchClaimedMap(selectedDate, startOfDay, endOfDay),
                    getActiveDietEmpIds()
                ]);
                cachedClaimedMap = claimedMap;

                if (allSystemDepartments.length === 0) {
                    allSystemDepartments = await fetchAllDepartments();
                    renderDepartmentCheckboxes();
                }

                const q = query(
                    ordersRef,
                    where("orderDate", ">=", Timestamp.fromDate(timeStart)),
                    where("orderDate", "<=", Timestamp.fromDate(timeEnd))
                );

                if (currentUnsubscribe) {
                    currentUnsubscribe();
                    currentUnsubscribe = null;
                }

                currentUnsubscribe = onSnapshot(q, (querySnapshot) => {
                    const employeeOrders = new Map();

                    querySnapshot.forEach((doc) => {
                        const orderData = doc.data();
                        const orderTime = orderData.orderDate.toDate();

                        if (!employeeOrders.has(orderData.employeeId) ||
                            orderTime < employeeOrders.get(orderData.employeeId).orderDate.toDate()) {
                            employeeOrders.set(orderData.employeeId, orderData);
                        }
                    });

                    const sortedOrders = Array.from(employeeOrders.values())
                        .sort((a, b) => a.orderDate.toDate() - b.orderDate.toDate());

                    rawSnapshotOrders = sortedOrders.map(orderData => {
                        const empId = String(orderData.employeeId).trim();

                        let displaySelection = orderData.mealSet || 'Normal';
                        if (displaySelection === 'A' || displaySelection === 'B') {
                            displaySelection = 'Normal';
                        }

                        if (displaySelection === 'Custom') {
                            if (orderData.customBroth) displaySelection = 'Extra broth';
                            else if (orderData.customMoreRice) displaySelection = 'More rice';
                            else if (orderData.customLessRice) displaySelection = 'Less rice';
                            else if (orderData.customAllergy) {
                                let allergyText = "";
                                if (typeof orderData.customAllergy === 'string' && orderData.customAllergy.toLowerCase() !== 'true' && orderData.customAllergy.toLowerCase() !== 'on') {
                                    allergyText = orderData.customAllergy;
                                } else if (orderData.allergyDetails) {
                                    allergyText = orderData.allergyDetails;
                                } else if (orderData.allergyType) {
                                    allergyText = orderData.allergyType;
                                }
                                displaySelection = allergyText ? 'Allergy: ' + allergyText : 'Allergy';
                            }
                            else displaySelection = 'Normal';
                        }

                        let isDiet = displaySelection.toLowerCase().includes('diet');
                        if (isDiet && !activeDietEmpIds.has(empId)) {
                            displaySelection = 'Normal';
                            isDiet = false;
                        }

                        return {
                            order: orderData,
                            empId,
                            mealLabel: displaySelection,
                            isDiet
                        };
                    });

                    processAndRenderOrders();
                }, (err) => {
                    console.error("Orders listener failed:", err);
                });

            } catch (error) {
                console.error("Error setting up data feed:", error);
                alert("An error occurred while fetching orders. Please try again.");
            }
        }

        async function sendInformationToAdmin() {
            const infoText = document.getElementById('infoTextarea').value.trim();
            if (!infoText) {
                alert("Please enter information before sending.");
                return;
            }

            try {
                await addDoc(collection(db, "adminMessages"), {
                    message: infoText,
                    timestamp: Timestamp.now(),
                    status: "unread"
                });
                alert("Information sent successfully to admin!");
                document.getElementById('infoTextarea').value = '';
            } catch (error) {
                console.error("Error sending information:", error);
                alert("Failed to send information. Please try again.");
            }
        }

        function formatDate(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const today = new Date();
            const datePicker = document.getElementById('datePicker');
            datePicker.value = formatDate(today);
            datePicker.max = formatDate(today);

            // Multi-select dropdown toggle
            const dropdownToggle = document.getElementById('deptDropdownToggle');
            const dropdownMenu = document.getElementById('deptDropdownMenu');
            dropdownToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('show');
            });
            document.addEventListener('click', (e) => {
                if (!document.getElementById('deptDropdownContainer').contains(e.target)) {
                    dropdownMenu.classList.remove('show');
                }
            });

            // Select All Departments
            const selectAllDepts = document.getElementById('selectAllDepts');
            selectAllDepts.addEventListener('change', () => {
                const checkboxes = document.querySelectorAll('.dept-checkbox');
                checkboxes.forEach(cb => cb.checked = selectAllDepts.checked);
                clearGroupButtons();
                updateSelectAllState();
                processAndRenderOrders();
            });

            // Quick department group buttons
            const stampingBtn = document.getElementById('stampingBtn');
            const mainCanteenBtn = document.getElementById('mainCanteenBtn');
            const totalBtn = document.getElementById('totalBtn');

            stampingBtn.addEventListener('click', () => {
                clearGroupButtons();
                stampingBtn.classList.add('active');
                applyGroupSelection(stampingDepartments);
            });
            mainCanteenBtn.addEventListener('click', () => {
                clearGroupButtons();
                mainCanteenBtn.classList.add('active');
                applyGroupSelection(mainCanteenDepartments);
            });
            totalBtn.addEventListener('click', () => {
                clearGroupButtons();
                totalBtn.classList.add('active');
                applyGroupSelection(totalsdepart);
            });

            // Time-of-day pills
            const timeButtons = {
                morning: document.getElementById('morningTimeBtn'),
                evening: document.getElementById('eveningTimeBtn'),
                all: document.getElementById('allTimeBtn')
            };
            Object.values(timeButtons).forEach(button => {
                button.addEventListener('click', function () {
                    Object.values(timeButtons).forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    loadData();
                });
            });

            document.getElementById('locationFilter').addEventListener('change', processAndRenderOrders);
            document.getElementById('claimStatusFilter').addEventListener('change', processAndRenderOrders);
            document.getElementById('mealTypeFilter').addEventListener('change', processAndRenderOrders);
            document.getElementById('fetchOrders').addEventListener('click', loadData);
            datePicker.addEventListener('change', loadData);

            document.getElementById('sendButton').addEventListener('click', sendInformationToAdmin);

            allSystemDepartments = await fetchAllDepartments();
            renderDepartmentCheckboxes();
            loadData();
        });
    </script>
</body>
</html>
