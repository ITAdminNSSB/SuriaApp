<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="auth-guard.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>MAIN MENU PAGE</title>
    <style>
* {margin: 0;padding: 0;box-sizing: border-box;}
body {font-family: 'San Francisco', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;background: linear-gradient(115deg, black, #334155);color: #ffffff;min-height: 100vh;display: flex;flex-direction: column;align-items: center;justify-content: flex-start;padding: 0;overflow-x: hidden;}
.container {max-width: 1200px;width: 100%;min-height: 100vh;display: flex;flex-direction: column;align-items: center;justify-content: center;padding: 40px 20px;position: relative;}
h1 {font-size: 2.2rem;margin-bottom: 40px;background: linear-gradient(45deg, #ffffff, #cccccc);-webkit-background-clip: text;background-clip: text;-webkit-text-fill-color: transparent;text-shadow: 0 2px 4px rgba(0,0,0,0.3);font-weight: 700;letter-spacing: -0.5px;text-align: center;}
.language-buttons {display: flex;justify-content: center;gap: 12px;margin-bottom: 30px;flex-wrap: wrap;}
.language-buttons button {background-color: #132029;color: white;border: none;padding: 10px 18px;border-radius: 8px;cursor: pointer;font-size: 15px;font-weight: 600;display: flex;align-items: center;gap: 6px;transition: all 0.3s ease;}
.language-buttons button.active {background-color: #24006c;}
.language-buttons button:hover {background-color: #0f0257;}
.language-buttons i {font-size: 18px;}
.buttons-container {display: grid;grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));gap: 20px;padding: 20px;width: 100%;max-width: 1200px;margin: 0 auto;}
.department-btn {display: flex;flex-direction: column;align-items: center;justify-content: center;padding: 25px 15px;border-radius: 12px;text-decoration: none;color: white;font-weight: 600;font-size: 18px;text-align: center;transition: all 0.3s ease;box-shadow: 0 4px 8px rgba(0,0,0,0.1);min-height: 120px;position: relative;overflow: hidden;border: 1px solid rgba(255, 255, 255, 0.1);}
.department-btn::before {content: '';position: absolute;top: 0;left: -100%;width: 100%;height: 100%;background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);transition: left 0.3s ease;}
.department-btn:hover::before {left: 100%;}
.department-btn:hover {transform: translateY(-5px);box-shadow: 0 6px 12px rgba(0,0,0,0.15);border-color: rgba(255,255,255,0.2);}
.department-btn:active {transform: translateY(0);box-shadow: 0 4px 8px rgba(0,0,0,0.1);animation: buttonPress 0.1s ease;}
@keyframes buttonPress {0% { transform: scale(1); }50% { transform: scale(0.98); }100% { transform: scale(1); }}
.button-icon {font-size: 36px;margin-bottom: 12px;display: inline-block;transition: transform 0.3s ease;}
.department-btn:hover .button-icon {transform: scale(1.1);}
.button-text {display: block;margin-top: 8px;}
.ripple {position: absolute;border-radius: 50%;background: rgba(255, 255, 255, 0.3);transform: scale(0);animation: ripple-animation 0.6s linear;pointer-events: none;}
@keyframes ripple-animation {to { transform: scale(4); opacity: 0; }}
.loading {position: relative;pointer-events: none;}
.loading::after {content: '';position: absolute;top: 50%;left: 50%;width: 20px;height: 20px;margin: -10px 0 0 -10px;border: 2px solid rgba(255,255,255,0.3);border-top: 2px solid #ffffff;border-radius: 50%;animation: spin 1s linear infinite;}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.food-ordering {background: linear-gradient(135deg, #FF7B54, #FFB26B);}
.production {background: linear-gradient(135deg, #4E9F3D, #95CD41);}
.quality-control {background: linear-gradient(135deg, #00A8CC, #0C7B93);}
.hr-department {background: linear-gradient(135deg, #9C51B6, #D862BC);}
.eng-department {background: linear-gradient(135deg, #4b49b8, #7375d2);}
@media (max-width: 768px) {.buttons-container {grid-template-columns: 1fr 1fr;}}
@media (max-width: 480px) {h1 { font-size: 1.8rem; margin-bottom: 30px; }
.buttons-container {grid-template-columns: 1fr;}
.department-btn {padding: 20px 10px;font-size: 16px;}
.button-icon {font-size: 30px;}}
    </style>
</head>
<body>
    <div class="container">
        <h1 data-translate="MainMenu">MAIN MENU</h1>0
        
        <div class="language-buttons">
            <button data-lang="en" class="selectlanguage active">
                <i class="fas fa-globe"></i> English
            </button>
            <button data-lang="ne" class="selectlanguage">
                <i class="fas fa-globe"></i> नेपाली
            </button>
            <button data-lang="bn" class="selectlanguage">
                <i class="fas fa-globe"></i> বাংলা
            </button>
            <button data-lang="ja" class="selectlanguage">
                <i class="fas fa-globe"></i> 日本語
            </button>
        </div>

        <div class="buttons-container">
            <a href="home.html" class="department-btn food-ordering">
                <span class="button-icon">🍽️</span>
                <span class="button-text" data-translate="employeeManagement">Employee Management</span>
            </a>
            <a href="prod_admin_user.html" class="department-btn production">
                <span class="button-icon">🏭</span>
                <span class="button-text" data-translate="productionDepartment">Production Department</span>
            </a>
            <a href="qc_main_Pg.html" class="department-btn quality-control">
                <span class="button-icon">✅</span>
                <span class="button-text" data-translate="QualityControlDepartment">Quality Control Department</span>
            </a>
            <a href="hcd_main_menu_pg.html" class="department-btn hr-department">
                <span class="button-icon">👥</span>
                <span class="button-text" data-translate="HumanResourcesDepartment">Human Resources Department</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeWithDetection, changeLanguage } from './translation.js';

        // Initialize translation script immediately
        if (typeof initializeWithDetection === 'function') {
            initializeWithDetection();
        }

        // Click events for the language buttons
        const langButtons = document.querySelectorAll('.language-buttons button');
        langButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                if (typeof changeLanguage === 'function') {
                    changeLanguage(lang);
                }

                // Update UI to show which button is active
                langButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Ripple effect and delayed navigation for department buttons
        const deptButtons = document.querySelectorAll('.department-btn');
        deptButtons.forEach(button => {
            button.addEventListener('click', event => {
                event.preventDefault(); // Stop immediate navigation to allow animation
                const targetUrl = button.getAttribute('href');

                button.classList.add('loading');

                const ripple = document.createElement('span');
                const rect = button.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                
                // Calculate click coordinates relative to the button
                const x = event.clientX - rect.left - size / 2;
                const y = event.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.classList.add('ripple');
                button.appendChild(ripple);
                
                // Navigate after the ripple finishes expanding
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 400); 

                // Clean up classes if returning via back button
                setTimeout(() => ripple.remove(), 600);
                setTimeout(() => button.classList.remove('loading'), 500);
            });

            // Touch support
            button.addEventListener('touchstart', () => button.style.transform = 'scale(0.98)');
            button.addEventListener('touchend', () => button.style.transform = 'scale(1)');
        });
    </script>
</body>
</html>
