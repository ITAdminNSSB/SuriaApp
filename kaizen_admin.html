<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaizen Admin Dashboard · SURIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      background: linear-gradient(135deg, #f0f4ff 0%, #e8edf5 100%);
      min-height: 100vh; 
      padding: 0; 
      margin: 0; 
    }

    /* Top Navigation */
    .top-nav {
      background: linear-gradient(135deg, #0b2a4a, #1a3f62);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(11, 42, 74, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }
    .back-button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      border-radius: 12px;
    }
    .back-button:hover { background: rgba(255, 255, 255, 0.2); transform: translateX(-3px); }
    .nav-title { color: white; font-size: 1.1rem; font-weight: 600; }
    .nav-badge {
      margin-left: auto;
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-export-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-export-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Page Content */
    .page-content { padding: 20px; max-width: 1400px; margin: 0 auto; }

    /* Quick Stats */
    .quick-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .quick-stat {
      background: white;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .quick-stat .number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0b2a4a;
    }
    .quick-stat .label {
      font-size: 0.75rem;
      color: #64748b;
    }
    .quick-stat.pending .number { color: #f59e0b; }
    .quick-stat.approved .number { color: #10b981; }
    .quick-stat.rejected .number { color: #ef4444; }

    /* Chart Section */
    .chart-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chart-header h3 {
      font-size: 1rem;
      color: #0b2a4a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-header h3 i { color: #0b2a4a; }
    .chart-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chart-controls select {
      padding: 6px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.8rem;
      background: #f8fafc;
      cursor: pointer;
    }
    .chart-controls select:focus {
      outline: none;
      border-color: #0b2a4a;
    }

    .chart-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      height: 200px;
      padding: 10px 0 5px 0;
      overflow-x: auto;
      min-height: 220px;
    }
    .bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 1 60px;
      min-width: 45px;
      max-width: 70px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar {
      width: 70%;
      max-width: 35px;
      border-radius: 4px 4px 0 0;
      transition: height 0.6s ease;
      position: relative;
      min-height: 4px;
      cursor: pointer;
    }
    .bar:hover {
      opacity: 0.85;
      transform: scaleX(1.05);
    }
    .bar-label {
      font-size: 0.6rem;
      color: #64748b;
      margin-top: 4px;
      text-align: center;
      font-weight: 600;
      word-break: break-word;
      max-width: 55px;
      line-height: 1.1;
      min-height: 24px;
    }
    .bar-value {
      font-size: 0.7rem;
      font-weight: 700;
      color: #0b2a4a;
      margin-bottom: 2px;
      min-height: 18px;
    }
    .bar-tooltip {
      display: none;
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: #0b2a4a;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      white-space: nowrap;
      z-index: 10;
      font-weight: 500;
    }
    .bar:hover .bar-tooltip {
      display: block;
    }

    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .chart-legend span {
      font-size: 0.7rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chart-legend .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    /* Filters */
    .filters-section {
      background: white;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .filters-section select,
    .filters-section input {
      padding: 8px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #f8fafc;
      min-width: 120px;
    }
    .filters-section select:focus,
    .filters-section input:focus {
      outline: none;
      border-color: #0b2a4a;
    }
    .filter-label {
      font-weight: 600;
      color: #1e293b;
      font-size: 0.8rem;
    }
    .filter-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.8rem;
    }
    .filter-btn-primary {
      background: #0b2a4a;
      color: white;
    }
    .filter-btn-primary:hover { background: #1a3f62; }
    .filter-btn-secondary {
      background: #e2e8f0;
      color: #64748b;
    }
    .filter-btn-secondary:hover { background: #cbd5e1; }

    /* Submission Cards */
    .submissions-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .submission-card {
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 4px solid #e2e8f0;
      transition: all 0.2s ease;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
    }
    .submission-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .submission-card.pending { border-left-color: #f59e0b; }
    .submission-card.approved { border-left-color: #10b981; }
    .submission-card.rejected { border-left-color: #ef4444; }

    .submission-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    /* Respondent Info */
    .respondent-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 6px 16px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 2px 0;
    }
    .respondent-info .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #1e293b;
    }
    .respondent-info .info-item i {
      color: #0b2a4a;
      width: 14px;
      font-size: 0.7rem;
    }
    .respondent-info .info-item .label {
      color: #94a3b8;
      font-weight: 500;
    }
    .respondent-info .info-item .value {
      font-weight: 600;
      color: #0b2a4a;
    }
    .respondent-info .info-item .value.complete { color: #10b981; }
    .respondent-info .info-item .value.incomplete { color: #f59e0b; }

    .submission-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .submission-user {
      font-weight: 700;
      color: #0b2a4a;
      font-size: 0.95rem;
    }
    .submission-dept {
      font-size: 0.7rem;
      color: #64748b;
      background: #f1f5f9;
      padding: 2px 10px;
      border-radius: 12px;
    }
    .submission-status {
      font-size: 0.65rem;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .submission-status.pending { background: #fef3c7; color: #92400e; }
    .submission-status.approved { background: #d1fae5; color: #065f46; }
    .submission-status.rejected { background: #fee2e2; color: #991b1b; }

    .submission-issue {
      font-size: 0.85rem;
      color: #1e293b;
      padding: 6px 12px;
      background: #f8fafc;
      border-radius: 6px;
      border-left: 3px solid #0b2a4a;
    }

    .submission-meta {
      display: flex;
      gap: 12px;
      font-size: 0.65rem;
      color: #94a3b8;
      flex-wrap: wrap;
    }
    .submission-meta i { width: 12px; }

    /* Actions */
    .submission-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      justify-content: center;
      min-width: 120px;
    }
    .action-row {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .action-btn {
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover { transform: translateY(-1px); }
    .action-btn.approve { background: #10b981; color: white; }
    .action-btn.approve:hover { background: #059669; }
    .action-btn.reject { background: #ef4444; color: white; }
    .action-btn.reject:hover { background: #dc2626; }

    .inline-stars {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .inline-stars i {
      font-size: 0.85rem;
      color: #d1d5db;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .inline-stars i:hover { transform: scale(1.2); }
    .inline-stars i.active { color: #f59e0b; }
    .star-label {
      font-size: 0.65rem;
      color: #94a3b8;
      margin-left: 4px;
    }

    .comment-section {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-top: 2px;
      width: 100%;
    }
    .comment-section input {
      flex: 1;
      padding: 4px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.7rem;
      background: #f8fafc;
      min-width: 60px;
    }
    .comment-section input:focus {
      outline: none;
      border-color: #0b2a4a;
    }
    .comment-section .comment-btn {
      background: #0b2a4a;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.65rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .comment-section .comment-btn:hover { background: #1a3f62; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 2000;
      animation: slideUp 0.3s ease;
      display: none;
    }
    .toast.success { background: #10b981; }
    .toast.error { background: #ef4444; }
    .toast.info { background: #0b2a4a; }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .loading-spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #0b2a4a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-container { text-align: center; padding: 40px 20px; }
    .no-results { text-align: center; padding: 40px 20px; color: #94a3b8; }
    .no-results i { font-size: 2.5rem; display: block; margin-bottom: 12px; color: #cbd5e1; }

    .bar-color-1 { background: linear-gradient(180deg, #0b2a4a, #1a3f62); }
    .bar-color-2 { background: linear-gradient(180deg, #10b981, #059669); }
    .bar-color-3 { background: linear-gradient(180deg, #f59e0b, #d97706); }
    .bar-color-4 { background: linear-gradient(180deg, #ef4444, #dc2626); }
    .bar-color-5 { background: linear-gradient(180deg, #8b5cf6, #7c3aed); }
    .bar-color-6 { background: linear-gradient(180deg, #ec4899, #db2777); }
    .bar-color-7 { background: linear-gradient(180deg, #14b8a6, #0d9488); }
    .bar-color-8 { background: linear-gradient(180deg, #f97316, #ea580c); }
    .bar-color-9 { background: linear-gradient(180deg, #6366f1, #4f46e5); }
    .bar-color-10 { background: linear-gradient(180deg, #22c55e, #16a34a); }

    @media (max-width: 768px) {
      .submission-card { grid-template-columns: 1fr; padding: 14px 16px; }
      .submission-actions { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; border-top: 1px solid #f1f5f9; padding-top: 10px; margin-top: 6px; min-width: unset; width: 100%; }
      .action-row { justify-content: flex-start; }
      .comment-section { flex-wrap: wrap; }
      .comment-section input { min-width: 100%; }
      .filters-section select,
      .filters-section input { min-width: 100%; }
      .quick-stats { grid-template-columns: repeat(2, 1fr); }
      .chart-container { height: 150px; gap: 10px; }
      .bar-wrapper { min-width: 30px; flex: 0 1 40px; }
      .bar { max-width: 25px; }
      .bar-label { font-size: 0.5rem; max-width: 40px; min-height: 20px; }
      .bar-value { font-size: 0.6rem; }
      .respondent-info { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .quick-stats { grid-template-columns: 1fr; }
      .top-nav { padding: 12px 16px; }
      .chart-header { flex-direction: column; align-items: stretch; }
      .chart-controls { flex-direction: column; }
      .chart-container { height: 120px; gap: 6px; }
      .bar-wrapper { min-width: 25px; flex: 0 1 30px; }
      .bar { max-width: 20px; }
      .respondent-info { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <button class="back-button" onclick="window.location.href='main_menu_pg.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="nav-title">Kaizen Admin Dashboard</div>
    <div class="nav-badge">
      <i class="fas fa-chart-line"></i> Evaluation Panel
    </div>
    <button class="nav-export-btn" onclick="exportToExcel()">
      <i class="fas fa-file-excel"></i> Export
    </button>
  </div>
  <div style="text-align: center;">
        <img src="pictures/logo_suria.png" alt="SCM" style="width: 400px; height: auto;">
      </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <div class="page-content">
    <!-- Quick Stats -->
    <div class="quick-stats" id="quickStats">
      <div class="quick-stat total">
        <div class="number" id="totalCount">0</div>
        <div class="label">Total</div>
      </div>
      <div class="quick-stat pending">
        <div class="number" id="pendingCount">0</div>
        <div class="label">⏳ Pending</div>
      </div>
      <div class="quick-stat approved">
        <div class="number" id="approvedCount">0</div>
        <div class="label">✅ Approved</div>
      </div>
      <div class="quick-stat rejected">
        <div class="number" id="rejectedCount">0</div>
        <div class="label">❌ Rejected</div>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="chart-section">
      <div class="chart-header">
        <h3><i class="fas fa-chart-bar"></i> Submissions by Department</h3>
        <div class="chart-controls">
          <select id="chartFilterDepartment">
            <option value="all">All Departments</option>
            <option value="HRA">HRA</option>
            <option value="FNA">FNA</option>
            <option value="MDO">MDO</option>
            <option value="BD&Project">BD&Project</option>
            <option value="SALES">SALES</option>
            <option value="PVD">PVD</option>
            <option value="SPECIAL PROJECT">SPECIAL PROJECT</option>
            <option value="QMS">QMS</option>
            <option value="QAQC">QAQC</option>
            <option value="PE/LPS">PE/LPS</option>
            <option value="MAINTENANCE">MAINTENANCE</option>
            <option value="PROD">PROD</option>
            <option value="PPCL">PPCL</option>
            <option value="SYNERGY">SYNERGY</option>
            <option value="SGTSB">SGTSB</option>
          </select>
          <select id="chartFilterStatus">
            <option value="all">All Status</option>
            <option value="pending">⏳ Pending</option>
            <option value="approved">✅ Approved</option>
            <option value="rejected">❌ Rejected</option>
          </select>
          <select id="chartFilterMonth">
            <option value="all">All Months</option>
          </select>
        </div>
      </div>
      <div id="chartContainer" class="chart-container">
        <!-- Bars rendered by JS -->
      </div>
      <div class="chart-legend">
        <span><span class="color-dot" style="background:#0b2a4a;"></span> Total</span>
        <span><span class="color-dot" style="background:#10b981;"></span> Approved</span>
        <span><span class="color-dot" style="background:#f59e0b;"></span> Pending</span>
        <span><span class="color-dot" style="background:#ef4444;"></span> Rejected</span>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <span class="filter-label"><i class="fas fa-filter"></i> Filters:</span>
      <select id="filterDepartment">
        <option value="">All Departments</option>
        <option value="HRA">HRA</option>
        <option value="FNA">FNA</option>
        <option value="MDO">MDO</option>
        <option value="BD&Project">BD&Project</option>
        <option value="SALES">SALES</option>
        <option value="PVD">PVD</option>
        <option value="SPECIAL PROJECT">SPECIAL PROJECT</option>
        <option value="QMS">QMS</option>
        <option value="QAQC">QAQC</option>
        <option value="PE/LPS">PE/LPS</option>
        <option value="MAINTENANCE">MAINTENANCE</option>
        <option value="PROD">PROD</option>
        <option value="PPCL">PPCL</option>
        <option value="SYNERGY">SYNERGY</option>
        <option value="SGTSB">SGTSB</option>
      </select>
      <select id="filterStatus">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <input type="month" id="filterMonth">
      <button onclick="applyFilters()" class="filter-btn filter-btn-primary">
        <i class="fas fa-search"></i> Apply
      </button>
      <button onclick="resetFilters()" class="filter-btn filter-btn-secondary">
        <i class="fas fa-undo"></i> Reset
      </button>
    </div>

    <!-- Submissions -->
    <div id="submissionsContainer">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <p style="margin-top:12px;color:#94a3b8;font-size:0.9rem;">Loading submissions...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
      authDomain: "suria-food-ordering-system.firebaseapp.com",
      projectId: "suria-food-ordering-system",
      storageBucket: "suria-food-ordering-system.firebasestorage.app",
      messagingSenderId: "204528329291",
      appId: "1:204528329291:web:cba270a2968e6d159963ce"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const COLLECTION_NAME = 'kaizen_submissions';
    let allSubmissions = [];
    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loadSubmissions();
      } else {
        window.location.replace("login_pg.html");
      }
    });

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function loadSubmissions() {
      const q = query(collection(db, COLLECTION_NAME), orderBy('submittedDate', 'desc'));
      
      onSnapshot(q, (snapshot) => {
        allSubmissions = [];
        snapshot.forEach((doc) => {
          const data = doc.data();
          let adminStatus = 'pending';
          if (data.adminStatus === 'approved') adminStatus = 'approved';
          else if (data.adminStatus === 'rejected') adminStatus = 'rejected';
          
          allSubmissions.push({
            id: doc.id,
            ...data,
            status: adminStatus,
            rating: data.rating || 0,
            adminComment: data.adminComment || '',
            collaborator: data.collaborator || '',
            kaizenStatus: data.kaizenStatus || 'Incomplete',
            issueDetails: data.issueDetails || 'No description'
          });
        });
        updateStats();
        populateMonthFilter();
        renderChart();
        applyFilters();
      }, (error) => {
        console.error('Error loading submissions:', error);
        document.getElementById('submissionsContainer').innerHTML = `
          <div class="no-results">
            <i class="fas fa-exclamation-circle"></i>
            <p>Error loading submissions. Please try again.</p>
          </div>
        `;
      });
    }

    function updateStats() {
      const total = allSubmissions.length;
      const pending = allSubmissions.filter(s => s.status === 'pending').length;
      const approved = allSubmissions.filter(s => s.status === 'approved').length;
      const rejected = allSubmissions.filter(s => s.status === 'rejected').length;

      document.getElementById('totalCount').textContent = total;
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('approvedCount').textContent = approved;
      document.getElementById('rejectedCount').textContent = rejected;
    }

    function populateMonthFilter() {
      const months = new Set();
      allSubmissions.forEach(sub => {
        if (sub.submittedDate) {
          const date = new Date(sub.submittedDate);
          const ym = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          months.add(ym);
        }
      });
      const select = document.getElementById('chartFilterMonth');
      const current = select.value;
      select.innerHTML = '<option value="all">All Months</option>';
      Array.from(months).sort().forEach(m => {
        const [y, mn] = m.split('-');
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        select.innerHTML += `<option value="${m}">${monthNames[parseInt(mn)-1]} ${y}</option>`;
      });
      if (current) select.value = current;
    }

    function renderChart() {
      const deptFilter = document.getElementById('chartFilterDepartment').value;
      const statusFilter = document.getElementById('chartFilterStatus').value;
      const monthFilter = document.getElementById('chartFilterMonth').value;

      let filtered = allSubmissions;

      // Apply department filter for chart
      if (deptFilter !== 'all') {
        filtered = filtered.filter(s => s.department === deptFilter);
      }

      if (statusFilter !== 'all') {
        filtered = filtered.filter(s => s.status === statusFilter);
      }

      if (monthFilter !== 'all') {
        filtered = filtered.filter(s => {
          if (!s.submittedDate) return false;
          const date = new Date(s.submittedDate);
          const ym = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          return ym === monthFilter;
        });
      }

      // Group by department
      const deptData = {};
      filtered.forEach(sub => {
        const dept = sub.department || 'Unknown';
        if (!deptData[dept]) {
          deptData[dept] = { total: 0, approved: 0, pending: 0, rejected: 0 };
        }
        deptData[dept].total++;
        if (sub.status === 'approved') deptData[dept].approved++;
        else if (sub.status === 'pending') deptData[dept].pending++;
        else if (sub.status === 'rejected') deptData[dept].rejected++;
      });

      const sortedDepts = Object.keys(deptData).sort();
      const maxTotal = sortedDepts.length > 0 ? Math.max(...sortedDepts.map(d => deptData[d].total)) : 0;

      const container = document.getElementById('chartContainer');
      
      if (sortedDepts.length === 0) {
        container.innerHTML = `
          <div style="width:100%;text-align:center;color:#94a3b8;padding:30px 0;">
            <i class="fas fa-chart-bar" style="font-size:1.8rem;display:block;margin-bottom:8px;"></i>
            No data to display
          </div>
        `;
        return;
      }

      const colors = ['bar-color-1', 'bar-color-2', 'bar-color-3', 'bar-color-4', 'bar-color-5', 
                      'bar-color-6', 'bar-color-7', 'bar-color-8', 'bar-color-9', 'bar-color-10'];

      const maxHeightPercent = 70;

      container.innerHTML = sortedDepts.map((dept, index) => {
        const data = deptData[dept];
        const percentage = maxTotal > 0 ? (data.total / maxTotal) * maxHeightPercent : 0;
        const height = Math.max(percentage, 5);
        const colorClass = colors[index % colors.length];
        
        const statusInfo = [];
        if (data.approved > 0) statusInfo.push(`✅ ${data.approved}`);
        if (data.pending > 0) statusInfo.push(`⏳ ${data.pending}`);
        if (data.rejected > 0) statusInfo.push(`❌ ${data.rejected}`);
        const tooltipText = `${dept}: ${data.total} total (${statusInfo.join(', ')})`;
        
        return `
          <div class="bar-wrapper">
            <div class="bar-value">${data.total}</div>
            <div class="bar ${colorClass}" style="height: ${height}%; min-height: 6px;">
              <span class="bar-tooltip">${tooltipText}</span>
            </div>
            <div class="bar-label">${dept}</div>
          </div>
        `;
      }).join('');
    }

    // Chart filter listeners
    document.getElementById('chartFilterDepartment').addEventListener('change', function() {
      renderChart();
    });
    document.getElementById('chartFilterStatus').addEventListener('change', function() {
      renderChart();
    });
    document.getElementById('chartFilterMonth').addEventListener('change', function() {
      renderChart();
    });

    function applyFilters() {
      const dept = document.getElementById('filterDepartment').value;
      const status = document.getElementById('filterStatus').value;
      const month = document.getElementById('filterMonth').value;

      let filtered = allSubmissions;
      if (dept) filtered = filtered.filter(s => s.department === dept);
      if (status) filtered = filtered.filter(s => s.status === status);
      if (month) {
        filtered = filtered.filter(s => {
          if (!s.submittedDate) return false;
          const date = new Date(s.submittedDate);
          const ym = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          return ym === month;
        });
      }
      renderSubmissions(filtered);
    }

    window.applyFilters = applyFilters;

    window.resetFilters = function() {
      document.getElementById('filterDepartment').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterMonth').value = '';
      applyFilters();
    };

    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      try {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { 
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch { return dateString; }
    }

    function getStatusLabel(status) {
      if (status === 'approved') return '✅ Approved';
      if (status === 'rejected') return '❌ Rejected';
      return '⏳ Pending';
    }

    window.approveSubmission = async function(id) {
      if (!confirm('Approve this submission?')) return;
      try {
        await updateDoc(doc(db, COLLECTION_NAME, id), {
          adminStatus: 'approved',
          evaluatedAt: new Date().toISOString()
        });
        showToast('✅ Approved!', 'success');
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      }
    };

    window.rejectSubmission = async function(id) {
      if (!confirm('Reject this submission?')) return;
      try {
        await updateDoc(doc(db, COLLECTION_NAME, id), {
          adminStatus: 'rejected',
          evaluatedAt: new Date().toISOString()
        });
        showToast('❌ Rejected', 'info');
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      }
    };

    window.setRatingInline = async function(id, rating) {
      try {
        await updateDoc(doc(db, COLLECTION_NAME, id), {
          rating: rating,
          evaluatedAt: new Date().toISOString()
        });
        showToast(`⭐ ${rating}/5 stars saved!`, 'success');
        const sub = allSubmissions.find(s => s.id === id);
        if (sub) sub.rating = rating;
        applyFilters();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      }
    };

    window.saveComment = async function(id) {
      const input = document.getElementById(`comment_${id}`);
      if (!input) return;
      const comment = input.value.trim();
      if (!comment) {
        showToast('Please enter a comment', 'error');
        return;
      }
      try {
        await updateDoc(doc(db, COLLECTION_NAME, id), {
          adminComment: comment,
          evaluatedAt: new Date().toISOString()
        });
        showToast('💬 Comment saved!', 'success');
        const sub = allSubmissions.find(s => s.id === id);
        if (sub) sub.adminComment = comment;
        applyFilters();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      }
    };

    function renderSubmissions(submissions) {
      const container = document.getElementById('submissionsContainer');

      if (submissions.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            <i class="fas fa-inbox"></i>
            <p>No submissions found</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="submissions-grid">
          ${submissions.map(sub => {
            const kaizenStatusClass = sub.kaizenStatus === 'Complete' ? 'complete' : 'incomplete';
            const kaizenIcon = sub.kaizenStatus === 'Complete' ? '✅' : '⏳';
            
            return `
            <div class="submission-card ${sub.status}">
              <div class="submission-main">
                <div class="submission-header-row">
                  <span class="submission-user">${sub.fullName || 'Unknown'}</span>
                  <span class="submission-dept">${sub.department || 'N/A'}</span>
                  <span class="submission-status ${sub.status}">${getStatusLabel(sub.status)}</span>
                </div>

                <div class="respondent-info">
                  <div class="info-item">
                    <i class="fas fa-id-badge"></i>
                    <span class="label">Staff ID:</span>
                    <span class="value">${sub.staffId || 'N/A'}</span>
                  </div>
                  <div class="info-item">
                    <i class="fas fa-user-friends"></i>
                    <span class="label">Collaborator:</span>
                    <span class="value">${sub.collaborator || 'None'}</span>
                  </div>
                  <div class="info-item">
                    <i class="fas fa-tag"></i>
                    <span class="label">Kaizen Status:</span>
                    <span class="value ${kaizenStatusClass}">
                      ${sub.kaizenStatus || 'Incomplete'} ${kaizenIcon}
                    </span>
                  </div>
                  <div class="info-item">
                    <i class="fas fa-calendar"></i>
                    <span class="label">Submitted:</span>
                    <span class="value">${formatDate(sub.submittedDate)}</span>
                  </div>
                  ${sub.evaluatedAt ? `
                  <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span class="label">Evaluated At:</span>
                    <span class="value">${formatDate(sub.evaluatedAt)}</span>
                  </div>
                  ` : ''}
                </div>

                <div class="submission-issue">
                  <strong>Issue Details:</strong> ${sub.issueDetails || 'No description'}
                </div>

                <div class="submission-meta">
                  ${sub.adminComment ? `<span><i class="fas fa-comment"></i> ${sub.adminComment}</span>` : ''}
                  ${sub.beforeImages ? `<span><i class="fas fa-image"></i> Has before image</span>` : ''}
                  ${sub.afterImages ? `<span><i class="fas fa-image"></i> Has after image</span>` : ''}
                </div>
              </div>

              <div class="submission-actions">
                <div class="action-row">
                  <div class="inline-stars" id="stars_${sub.id}">
                    ${[1,2,3,4,5].map(star => `
                      <i class="fas fa-star ${star <= sub.rating ? 'active' : ''}" 
                         onclick="setRatingInline('${sub.id}', ${star})"
                         onmouseover="this.style.color='#fbbf24'"
                         onmouseout="this.style.color='${star <= sub.rating ? '#f59e0b' : '#d1d5db'}'">
                      </i>
                    `).join('')}
                    <span class="star-label">${sub.rating > 0 ? sub.rating + '/5' : 'Rate'}</span>
                  </div>
                </div>

                <div class="action-row">
                  ${sub.status !== 'approved' ? `
                    <button class="action-btn approve" onclick="approveSubmission('${sub.id}')">
                      <i class="fas fa-check"></i> Approve
                    </button>
                  ` : ''}
                  ${sub.status !== 'rejected' ? `
                    <button class="action-btn reject" onclick="rejectSubmission('${sub.id}')">
                      <i class="fas fa-times"></i> Reject
                    </button>
                  ` : ''}
                </div>

                <div class="comment-section">
                  <input type="text" id="comment_${sub.id}" 
                         placeholder="Add comment..." 
                         value="${sub.adminComment || ''}"
                         onkeypress="if(event.key==='Enter') saveComment('${sub.id}')">
                  <button class="comment-btn" onclick="saveComment('${sub.id}')">
                    <i class="fas fa-paper-plane"></i>
                  </button>
                </div>
              </div>
            </div>
          `}).join('')}
        </div>
      `;
    }

    window.exportToExcel = function() {
      if (allSubmissions.length === 0) {
        showToast('No data to export!', 'error');
        return;
      }

      const headers = [
        'Full Name', 'Staff ID', 'Department', 'Collaborator',
        'Issue Details', 'Kaizen Status (Respondent)', 'Admin Status',
        'Rating', 'Admin Comment', 'Submitted Date',
        'Evaluated At'
      ];

      const rows = allSubmissions.map(sub => [
        sub.fullName || 'N/A',
        sub.staffId || 'N/A',
        sub.department || 'N/A',
        sub.collaborator || 'None',
        sub.issueDetails || 'N/A',
        sub.kaizenStatus || 'Incomplete',
        getStatusLabel(sub.status),
        sub.rating || 0,
        sub.adminComment || '',
        formatDate(sub.submittedDate),
        sub.evaluatedAt ? formatDate(sub.evaluatedAt) : 'N/A'
      ]);

      let csv = headers.join(',') + '\n';
      rows.forEach(row => {
        const escaped = row.map(cell => {
          if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"'))) {
            return `"${cell.replace(/"/g, '""')}"`;
          }
          return cell;
        });
        csv += escaped.join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `kaizen_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
      showToast(`📊 Exported ${allSubmissions.length} submissions!`, 'success');
    };

    console.log('✅ Kaizen Admin Dashboard loaded!');
  </script>
</body>
</html>
