 /* Modern Reset and Variables */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #16a34a;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --transition: all 0.2s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Base Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .app-container {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Typography */
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
            letter-spacing: -0.025em;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Menu Section Styling */
        .menu-section {
            background: var(--card-background);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .menu-section:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* Button Styles */
        .add-item-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-item-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-1px);
        }

        .add-item-btn:before {
            content: '+';
            font-size: 1.25rem;
        }

        /* Menu Items */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .menu-item:hover {
            background-color: #f8fafc;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-background);
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

            <span>Update Menu</span>

  <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCno2NNkzt3gLdC4CfZ4TlhwESQJgI_IXk",
        authDomain: "test-login2-e4c7f.firebaseapp.com",
        databaseURL: "https://test-login2-e4c7f-default-rtdb.firebaseio.com",
        projectId: "test-login2-e4c7f",
        storageBucket: "test-login2-e4c7f.appspot.com",
        messagingSenderId: "698181575885",
        appId: "1:698181575885:web:4e9110486e5c6fd5eab584"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 10,
            qrbox: { width: 250, height: 250 }
        }
    );

    // Function to get today's scanned employee IDs
    async function getTodaysScannedEmployeeIds() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        try {
            const querySnapshot = await db.collection('claimed')
                .where('timestamp', '>=', today)
                .where('timestamp', '<', tomorrow)
                .get();
            
            return querySnapshot.docs.map(doc => doc.data().employeeId);
        } catch (error) {
            console.error('Error getting today\'s scans:', error);
            return [];
        }
    }

    // Success callback function
    async function onScanSuccess(decodedText, decodedResult) {
        try {
            let employeeData = JSON.parse(decodedText);
            
            // Get today's scanned employee IDs
            const scannedIds = await getTodaysScannedEmployeeIds();
            
            // Check if this employee ID has already been scanned today
            if (scannedIds.includes(employeeData.employeeId)) {
                showDuplicateModal();
                return;
            }

            // If not a duplicate, proceed with saving
            const scanData = {
                ...employeeData,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                scannedDate: new Date().toLocaleDateString(),
                scannedTime: new Date().toLocaleTimeString()
            };

            await db.collection('claimed').add(scanData);
            updateResultDisplay(`Successfully scanned: ${employeeData.name || 'Employee'} (ID: ${employeeData.employeeId})`);
            await loadTodaysScanHistory();

        } catch (error) {
            console.error('Scan error:', error);
            updateResultDisplay(error.message || 'An error occurred while processing the scan.', false);
        }
    }

    // Function to show duplicate modal
    function showDuplicateModal() {
        const modal = document.getElementById('duplicateModal');
        modal.style.display = 'block';
        // Stop the scanner temporarily
        if (html5QrcodeScanner) {
            html5QrcodeScanner.pause();
            setTimeout(() => {
                html5QrcodeScanner.resume();
            }, 2000); // Resume after 2 seconds
        }
    }

    // Function to close duplicate modal
    function closeDuplicateModal() {
        const modal = document.getElementById('duplicateModal');
        modal.style.display = 'none';
        // Resume the scanner if it was paused
        if (html5QrcodeScanner) {
            html5QrcodeScanner.resume();
        }
    }

    // Load scan history function
    async function loadTodaysScanHistory() {
        const scanHistoryBody = document.getElementById('scanHistoryBody');
        if (!scanHistoryBody) return;

        try {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            const querySnapshot = await db.collection('claimed')
                .where('timestamp', '>=', today)
                .where('timestamp', '<', tomorrow)
                .orderBy('timestamp', 'desc')
                .get();

            scanHistoryBody.innerHTML = '';

            if (querySnapshot.empty) {
                scanHistoryBody.innerHTML = '<tr><td colspan="3">No scans found for today</td></tr>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const timestamp = data.timestamp?.toDate() || new Date();
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${data.employeeId || 'N/A'}</td>
                    <td>${timestamp.toLocaleDateString()}</td>
                    <td>${timestamp.toLocaleTimeString()}</td>
                `;
                scanHistoryBody.appendChild(row);
            });

        } catch (error) {
            console.error('Error loading scan history:', error);
            scanHistoryBody.innerHTML = '<tr><td colspan="3">Error loading scan history</td></tr>';
        }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
        // Close modal when clicking on X
        const closeModal = document.querySelector('.close-modal');
        if (closeModal) {
            closeModal.onclick = closeDuplicateModal;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('duplicateModal');
            if (event.target === modal) {
                closeDuplicateModal();
            }
        };

        // Start scanner and load initial history
        html5QrcodeScanner.render(onScanSuccess);
        loadTodaysScanHistory();
    });

    // Export functions for external use
    window.closeDuplicateModal = closeDuplicateModal;
    </script>
</body>
</html>
