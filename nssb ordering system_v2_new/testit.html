    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCno2NNkzt3gLdC4CfZ4TlhwESQJgI_IXk",
    authDomain: "test-login2-e4c7f.firebaseapp.com",
    projectId: "test-login2-e4c7f",
    storageBucket: "test-login2-e4c7f.appspot.com",
    messagingSenderId: "698181085162",
    appId: "1:698181085162:web:3b91954eb1779a05894cd2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// DOM Elements
const submitButton = document.getElementById('submitOrder');
const thankYouMessage = document.getElementById('thankYouMessage');
const overlay = document.getElementById('overlay');
const loadingSpinner = document.getElementById('loadingSpinner');
const timeMessage = document.getElementById('time-message');
const calendarElement = document.getElementById('calendar');
const plusButton = document.getElementById('plusButton');
const floatingMenu = document.getElementById('floatingMenu');
const mealSetsContainer = document.getElementById('mealSets');

let selectedMealSet = null;

// Set up calendar
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
calendarElement.textContent = today.toLocaleDateString('en-US', options);

function isOrderingTime() {
    const currentTime = new Date();
    const morningStart = new Date(currentTime).setHours(4, 0, 0, 0);
    const morningEnd = new Date(currentTime).setHours(10, 0, 0, 0);
    const eveningStart = new Date(currentTime).setHours(14, 0, 0, 0);
    const eveningEnd = new Date(currentTime).setHours(21, 0, 0, 0);
    
    return {
        isValid: (currentTime >= morningStart && currentTime <= morningEnd) || 
                (currentTime >= eveningStart && currentTime <= eveningEnd),
        isNightShift: currentTime >= eveningStart && currentTime <= eveningEnd
    };
}

function storeOrderData(orderData) {
    localStorage.setItem('orderData', JSON.stringify(orderData));
    localStorage.setItem('orderDate', new Date().toISOString());
}

function isStoredOrderFromToday() {
    const storedDate = localStorage.getItem('orderDate');
    if (!storedDate) return false;

    const currentDate = new Date();
    const storedDateTime = new Date(storedDate);

    return storedDateTime.getDate() === currentDate.getDate() &&
           storedDateTime.getMonth() === currentDate.getMonth() &&
           storedDateTime.getFullYear() === currentDate.getFullYear();
}

function clearStoredOrderData() {
    localStorage.removeItem('orderData');
    localStorage.removeItem('orderDate');
}

function setupMealSetSelection() {
    const mealSetOptions = document.querySelectorAll('.meal-set-option');
    mealSetOptions.forEach(option => {
        option.addEventListener('click', () => {
            mealSetOptions.forEach(opt => opt.classList.remove('selected'));
            option.classList.add('selected');
            selectedMealSet = option.dataset.set;
            submitButton.style.display = 'inline-block';
        });
    });
}

async function getOrderDetails(orderRef) {
    try {
        const orderDoc = await getDoc(orderRef);
        if (orderDoc.exists()) {
            const fullData = orderDoc.data();
            return {
                employeeId: fullData.employeeId,
                orderDate: fullData.orderDate,
                orderTimestamp: fullData.orderTimestamp,
                orderStatus: fullData.orderStatus,
                mealSet: fullData.mealSet
            };
        }
        throw new Error("Order not found");
    } catch (error) {
        console.error("Error getting order details:", error);
        return null;
    }
}

function generateQRCode(data) {
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';
    
    const qrData = {
        employeeId: data.employeeId,
        orderDate: data.orderDate,
        orderTimestamp: data.orderTimestamp,
        orderStatus: data.orderStatus,
        mealSet: data.mealSet
    };

    new QRCode(qrContainer, {
        text: JSON.stringify(qrData),
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    const downloadBtn = document.getElementById('downloadQR');
    downloadBtn.style.display = 'block';
    downloadBtn.onclick = () => {
        const canvas = qrContainer.querySelector('canvas');
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.href = image;
        link.download = `order-qr-${data.orderTimestamp}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
}

async function checkPreviousOrder(userID, collectionRef) {
    try {
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        const q = query(
            collectionRef, 
            where("userId", "==", userID),
            where("noEatingDate", ">=", todayStart)
        );
        const querySnapshot = await getDocs(q);
        return querySnapshot.empty;
    } catch (error) {
        console.error("Error checking previous entries:", error);
        return true;
    }
}

async function processOrder(userID) {
    try {
        const timeStatus = isOrderingTime();
        if (!timeStatus.isValid) {
            alert("Order is closed. Please order between 4 AM - 6 PM or 7 PM - 9 PM.");
            return;
        }

        if (timeStatus.isNightShift && !selectedMealSet) {
            alert("Please select a meal set before submitting your order.");
            return;
        }

        const hasNoPreviousOrder = await checkPreviousOrder(userID, collection(db, "orders"));
        if (!hasNoPreviousOrder) {
            alert("You have already placed an order today.");
            return;
        }

        overlay.style.display = 'block';
        loadingSpinner.style.display = 'block';

        const userDoc = await getDoc(doc(db, "users", userID));
        if (!userDoc.exists()) throw new Error("Could not get user info");

        const userData = userDoc.data();
        const orderDetails = {
            ...userData,
            orderDate: serverTimestamp(),
            orderTimestamp: new Date(),
            userId: userID,
            orderStatus: "ordered",
            mealSet: timeStatus.isNightShift ? selectedMealSet : null
        };

        const orderRef = await addDoc(collection(db, "orders"), orderDetails);
        const savedOrder = await getOrderDetails(orderRef);
        
        thankYouMessage.style.display = 'block';
        generateQRCode(savedOrder);
        submitButton.style.display = 'none';
        storeOrderData(orderDetails);
    } catch (error) {
        console.error("Error processing order:", error);
        alert("There was an error processing your order. Please try again.");
        thankYouMessage.style.display = 'none';
    } finally {
        overlay.style.display = 'none';
        loadingSpinner.style.display = 'none';
    }
}

async function checkAndDisplayExistingOrder(userID) {
    try {
        if (isStoredOrderFromToday()) {
            restoreOrderDisplay();
            return;
        }

        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);

        const q = query(
            collection(db, "orders"),
            where("userId", "==", userID),
            where("orderDate", ">=", todayStart)
        );

        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
            const orderData = querySnapshot.docs[0].data();
            thankYouMessage.style.display = 'block';
            generateQRCode(orderData);
            submitButton.style.display = 'none';
            storeOrderData(orderData);
        }
    } catch (error) {
        console.error("Error checking existing order:", error);
    }
}

function restoreOrderDisplay() {
    if (isStoredOrderFromToday()) {
        const orderData = JSON.parse(localStorage.getItem('orderData'));
        if (orderData) {
            thankYouMessage.style.display = 'block';
            generateQRCode(orderData);
            submitButton.style.display = 'none';
        }
    } else {
        clearStoredOrderData();
    }
}

// Event Handlers
window.handleYesClick = async function() {
    const user = auth.currentUser;
    if (!user) {
        alert("Please log in to continue");
        return;
    }

    const timeStatus = isOrderingTime();
    const hasNoPreviousOrder = await checkPreviousOrder(user.uid, collection(db, "orders"));

    if (!timeStatus.isValid) {
        timeMessage.textContent = "Order is closed. Please order between 4 AM - 6 PM or 7 PM - 9 PM.";
        submitButton.style.display = 'none';
        return;
    }

    if (!hasNoPreviousOrder) {
        timeMessage.textContent = "You have already placed an order today.";
        submitButton.style.display = 'none';
        return;
    }

    if (timeStatus.isNightShift) {
        mealSetsContainer.style.display = 'block';
        submitButton.style.display = 'none';
        timeMessage.textContent = "Please select your meal set.";
        setupMealSetSelection();
    } else {
        submitButton.style.display = 'inline-block';
        timeMessage.textContent = "You can place an order.";
    }
};

// [Previous handleNoClick implementation remains the same]

// Event Listeners
submitButton.addEventListener("click", () => {
    auth.onAuthStateChanged((user) => {
        if (user) {
            processOrder(user.uid);
        } else {
            alert("Please log in to place an order");
        }
    });
});

plusButton.addEventListener('click', () => {
    plusButton.classList.toggle('active');
    floatingMenu.classList.toggle('active');
});

document.addEventListener('click', (e) => {
    if (!plusButton.contains(e.target) && !floatingMenu.contains(e.target)) {
        plusButton.classList.remove('active');
        floatingMenu.classList.remove('active');
    }
});

// Initialization
auth.onAuthStateChanged((user) => {
    if (user) checkAndDisplayExistingOrder(user.uid);
});

document.addEventListener('DOMContentLoaded', () => {
    restoreOrderDisplay();
});

// Auto-clear check
setInterval(() => {
    const now = new Date();
    const endOfDay = new Date(now);
    endOfDay.setHours(23, 59, 59, 999);
    
    if (now >= endOfDay && !isStoredOrderFromToday()) {
        clearStoredOrderData();
        location.reload();
    }
}, 60000);
    </script>
