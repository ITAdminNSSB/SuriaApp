 /* Modern Reset and Variables */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #16a34a;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --transition: all 0.2s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Base Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .app-container {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Typography */
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
            letter-spacing: -0.025em;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Menu Section Styling */
        .menu-section {
            background: var(--card-background);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .menu-section:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
        }

        /* Button Styles */
        .add-item-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-item-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-1px);
        }

        .add-item-btn:before {
            content: '+';
            font-size: 1.25rem;
        }

        /* Menu Items */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .menu-item:hover {
            background-color: #f8fafc;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-background);
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Save All Button */
        .save-all-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: var(--success-color);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .save-all-btn:hover {
            transform: translateY(-2px);
            background-color: #15803d;
        }

        .save-all-btn:before {
            content: '💾';
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
            z-index: 2000;
        }

        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .app-container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.875rem;
            }

            .menu-section {
                padding: 1rem;
            }

            .save-all-btn {
                bottom: 1rem;
                right: 1rem;
                padding: 0.75rem 1.5rem;
            }
        }

    <script>
        // Touch handling for sidebar
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            const swipeDistance = touchEndX - touchStartX;
            
            // Right to left swipe (close sidebar)
            if (swipeDistance < -50 && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            }
            // Left to right swipe (open sidebar)
            else if (swipeDistance > 50 && !sidebar.classList.contains('active')) {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            }
        }

        // Toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Toggle FAB menu
        function toggleFabMenu() {
            const fabMenu = document.getElementById('fab-menu');
            fabMenu.classList.toggle('active');
        }

          function navigateTo(page) {

    // Set current date

        const plusButton = document.getElementById('plusButton');
        const floatingMenu = document.getElementById('floatingMenu');

        plusButton.addEventListener('click', () => {
            plusButton.classList.toggle('active');
            floatingMenu.classList.toggle('active');
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!plusButton.contains(e.target) && !floatingMenu.contains(e.target)) {
                plusButton.classList.remove('active');
                floatingMenu.classList.remove('active');
            }
        });

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const nameinfo = document.getElementById('nameinfo');

        // Function to display user info
        function displayUserInfo(userID) {
            const userDocRef = doc(db, "users", userID);
            getDoc(userDocRef).then((doc) => {
                if (doc.exists()) {
                    const userInfo = doc.data();
                    nameinfo.innerHTML = `<div class="detail-item"><i class="fas fa-user"></i> <span>${userInfo.name}</span></div>`;
                } else {
                    nameinfo.innerHTML = `<p>User info not found</p>`;
                }
            }).catch((error) => {
                console.error("Error fetching user info:", error);
            });
        }

        // Fetch and display menu items from Firestore
        async function fetchMenuItems() {
            try {
                const menuDocRef = doc(db, 'food', 'menu');
                const menuSnapshot = await getDoc(menuDocRef);

                if (menuSnapshot.exists()) {
                    const menuData = menuSnapshot.data();
                    displayMenuItems(menuData.breakfast || [], 'breakfast-items');
                    displayMenuItems(menuData.lunch || [], 'lunch-items');
                    displayMenuItems(menuData.teatime || [], 'teatime-items');
                } else {
                    console.error("No menu document found!");
                }
            } catch (error) {
                console.error("Error fetching menu items:", error);
                document.querySelectorAll('.loading').forEach(elem => {
                    elem.textContent = 'Error loading menu items';
                });
            }
        }

        // Function to display menu items
        function displayMenuItems(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; // Clear loading message

            if (items.length === 0) {
                container.innerHTML = '<div class="menu-item">No items available</div>';
                return;
            }

            items.forEach(item => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.innerHTML = `
                    <div class="menu-item-details">
                        <span class="menu-item-name">${item.name}</span>
                        <span class="menu-item-price">RM ${item.price.toFixed(2)}</span>
                    </div>
                `;
                container.appendChild(menuItem);
            });
        }

        // Monitor user authentication and display info
        onAuthStateChanged(auth, (user) => {
            if (user) {
                displayUserInfo(user.uid);
            } else {
                nameinfo.innerHTML = `<p>Please log in</p>`;
            }
        });

        // Call fetchMenuItems to load menu on page load
        fetchMenuItems();
    </script>
</body>
</html>
