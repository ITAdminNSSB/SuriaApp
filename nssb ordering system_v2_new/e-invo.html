   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Generated Invoice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        input, button {
            margin: 5px 0;
            padding: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .total {
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Invoice Generator</h2>
        <label>Item Name:</label>
        <input type="text" id="itemName" placeholder="Enter item name">
        <label>Price:</label>
        <input type="number" id="itemPrice" placeholder="Enter price">
        <button onclick="addItem()">Add Item</button>
        
        <h3>Invoice</h3>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price (RM)</th>
                </tr>
            </thead>
            <tbody id="invoiceBody"></tbody>
            <tfoot>
                <tr>
                    <td class="total">Total:</td>
                    <td class="total" id="totalPrice">RM 0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>
    
    <script>
        let total = 0;
        function addItem() {
            let name = document.getElementById("itemName").value;
            let price = parseFloat(document.getElementById("itemPrice").value);
            if (name && price) {
                let table = document.getElementById("invoiceBody");
                let row = table.insertRow();
                row.insertCell(0).innerText = name;
                row.insertCell(1).innerText = "RM " + price.toFixed(2);
                total += price;
                document.getElementById("totalPrice").innerText = "RM " + total.toFixed(2);
                document.getElementById("itemName").value = "";
                document.getElementById("itemPrice").value = "";
            }
        }
    </script>
</body>
</html>
