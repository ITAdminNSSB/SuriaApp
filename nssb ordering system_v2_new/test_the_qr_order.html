    <script type="module">
         import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCno2NNkzt3gLdC4CfZ4TlhwESQJgI_IXk",
    authDomain: "test-login2-e4c7f.firebaseapp.com",
    databaseURL: "https://test-login2-e4c7f-default-rtdb.firebaseio.com",
    projectId: "test-login2-e4c7f",
    storageBucket: "test-login2-e4c7f.appspot.com",
    messagingSenderId: "698181575885",
    appId: "1:698181575885:web:4e9110486e5c6fd5eab584"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Initialize elements
const submitButton = document.getElementById('submitOrder');
const thankYouMessage = document.getElementById('thankYouMessage');
const overlay = document.getElementById('overlay');
const loadingSpinner = document.getElementById('loadingSpinner');
const timeMessage = document.getElementById('time-message');

// Set up calendar
const calendarElement = document.getElementById('calendar');
const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
calendarElement.textContent = today.toLocaleDateString('en-US', options);

// Check if current time is within ordering hours
function isOrderingTime() {
    const currentTime = new Date();
    const currentHour = currentTime.getHours();
    const currentMinute = currentTime.getMinutes();

    const morningStart = new Date(currentTime);
    morningStart.setHours(6, 0, 0, 0);

    const morningEnd = new Date(currentTime);
    morningEnd.setHours(18, 0, 0, 0);

    const eveningStart = new Date(currentTime);
    eveningStart.setHours(19, 0, 0, 0);

    const eveningEnd = new Date(currentTime);
    eveningEnd.setHours(21, 0, 0, 0);

    return (currentTime >= morningStart && currentTime <= morningEnd) || 
           (currentTime >= eveningStart && currentTime <= eveningEnd);
}

// Function to retrieve order details
async function getOrderDetails(orderRef) {
    try {
        const orderDoc = await getDoc(orderRef);
        if (orderDoc.exists()) {
            return orderDoc.data();
        }
        throw new Error("Order not found");
    } catch (error) {
        console.error("Error getting order details:", error);
        return null;
    }
}

// Function to generate QR code
function generateQRCode(data) {
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';

    new QRCode(qrContainer, {
        text: JSON.stringify(data),
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    const downloadBtn = document.getElementById('downloadQR');
    downloadBtn.style.display = 'block';
    downloadBtn.addEventListener('click', () => {
        const canvas = qrContainer.querySelector('canvas');
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.href = image;
        link.download = `order-qr-${data.orderTimestamp}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
}

async function checkPreviousOrder(userID, collection) {
    try {
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);

        const q = query(
            collection, 
            where("userId", "==", userID),
            where("noEatingDate", ">=", todayStart)
        );

        const querySnapshot = await getDocs(q);
        return querySnapshot.empty;
    } catch (error) {
        console.error("Error checking previous entries:", error);
        return true;
    }
}

async function getUserInfo(userID) {
    try {

        const userDoc = await getDoc(doc(db, "users", userID));
        if (userDoc.exists()) {
            return userDoc.data();
        }
        throw new Error("User data not found");
    } catch (error) {
        console.error("Error getting user info:", error);
        return null;
    }
}

// Create a custom confirmation dialog
function showConfirmationDialog(message) {
    return new Promise((resolve) => {
        const confirmationContainer = document.createElement('div');
        confirmationContainer.style.position = 'fixed';
        confirmationContainer.style.top = '50%';
        confirmationContainer.style.left = '50%';
        confirmationContainer.style.transform = 'translate(-50%, -50%)';
        confirmationContainer.style.backgroundColor = 'white';
        confirmationContainer.style.padding = '20px';
        confirmationContainer.style.borderRadius = '15px';
        confirmationContainer.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.1)';
        confirmationContainer.style.zIndex = '1100';
        confirmationContainer.style.textAlign = 'center';
        confirmationContainer.style.maxWidth = '90%';
        confirmationContainer.style.width = '300px';

        const messageElement = document.createElement('p');
        messageElement.textContent = message;
        messageElement.style.marginBottom = '20px';
        confirmationContainer.appendChild(messageElement);

        const buttonContainer = document.createElement('div');
        buttonContainer.style.display = 'flex';
        buttonContainer.style.justifyContent = 'center';
        buttonContainer.style.gap = '15px';

        const yesButton = document.createElement('button');
        yesButton.textContent = 'Yes';
        yesButton.style.padding = '10px 20px';
        yesButton.style.backgroundColor = '#28a745';
        yesButton.style.color = 'white';
        yesButton.style.border = 'none';
        yesButton.style.borderRadius = '5px';
        yesButton.style.cursor = 'pointer';

        const noButton = document.createElement('button');
        noButton.textContent = 'No';
        noButton.style.padding = '10px 20px';
        noButton.style.backgroundColor = '#dc3545';
        noButton.style.color = 'white';
        noButton.style.border = 'none';
        noButton.style.borderRadius = '5px';
        noButton.style.cursor = 'pointer';

        const overlayElement = document.createElement('div');
        overlayElement.style.position = 'fixed';
        overlayElement.style.top = '0';
        overlayElement.style.left = '0';
        overlayElement.style.width = '100%';
        overlayElement.style.height = '100%';
        overlayElement.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
        overlayElement.style.zIndex = '1000';

        yesButton.addEventListener('click', () => {
            document.body.removeChild(confirmationContainer);
            document.body.removeChild(overlayElement);
            resolve(true);
        });

        noButton.addEventListener('click', () => {
            document.body.removeChild(confirmationContainer);
            document.body.removeChild(overlayElement);
            resolve(false);
        });

        buttonContainer.appendChild(yesButton);
        buttonContainer.appendChild(noButton);
        confirmationContainer.appendChild(buttonContainer);

        document.body.appendChild(overlayElement);
        document.body.appendChild(confirmationContainer);
    });
}

// Handle Yes button click
window.handleYesClick = async function() {
    const user = auth.currentUser;
    if (!user) {
        alert("Please log in to continue");
        return;
    }

    const isTimeValid = isOrderingTime();
    const hasNoPreviousOrder = await checkPreviousOrder(user.uid, collection(db, "orders"));

    if (!isTimeValid) {
        timeMessage.textContent = "Order is closed. Please order between 6 AM - 10 AM or 7 PM - 9 PM.";
        submitButton.style.display = 'none';
        return;
    }

    if (!hasNoPreviousOrder) {
        timeMessage.textContent = "You have already placed an order today.";
        submitButton.style.display = 'none';
        return;
    }

    submitButton.style.display = 'inline-block';
    timeMessage.textContent = "You can place an order.";
};

// Handle No button click
window.handleNoClick = async function() {
    const user = auth.currentUser;
    if (!user) {
        alert("Please log in to continue");
        return;
    }

    const isTimeValid = isOrderingTime();
    const hasNoPreviousNoEating = await checkPreviousOrder(user.uid, collection(db, "noEating"));

    if (!isTimeValid) {
        alert("You can only submit 'No Eating' during 6 AM - 10 AM or 7 PM - 9 PM.");
        return;
    }

    if (!hasNoPreviousNoEating) {
        alert("You have already submitted a 'No Eating' entry today.");
        return;
    }

    const confirmed = await showConfirmationDialog("Are you sure you don't want to order food today?");
    
    if (!confirmed) {
        return;
    }

    try {
        overlay.style.display = 'block';
        loadingSpinner.style.display = 'block';

        const userInfo = await getUserInfo(user.uid);
        if (!userInfo) {
            throw new Error("Could not get user info");
        }

        const noEatingDetails = {
            userId: user.uid,
            noEatingDate: serverTimestamp(),
            orderTimestamp: new Date(),
            timeSlot: isOrderingTime() === true ? 
                (new Date().getHours() >= 6 && new Date().getHours() < 14 ? 'morning' : 'evening') 
                : 'unknown',
            ...userInfo
        };

        await addDoc(collection(db, "noEating"), noEatingDetails);
        alert('Thank you for letting us know!');
		 window.location.href = 'home.html';

    } catch (error) {
        console.error("Error processing no eating option:", error);
        alert("There was an error. Please try again.");
    } finally {
        overlay.style.display = 'none';
        loadingSpinner.style.display = 'none';
    }
};

// Function to check if order is from previous day
function isFromPreviousDay(timestamp) {
    const orderDate = new Date(timestamp);
    const currentDate = new Date();
    
    return orderDate.getDate() !== currentDate.getDate() ||
           orderDate.getMonth() !== currentDate.getMonth() ||
           orderDate.getFullYear() !== currentDate.getFullYear();
}

// Function to hide thank you message and QR code
function hideOrderConfirmation() {
    thankYouMessage.style.display = 'none';
    document.getElementById('qrcode').innerHTML = '';
    document.getElementById('downloadQR').style.display = 'none';
}

// Check for existing order and display if from today
async function checkAndDisplayExistingOrder(userID) {
    try {
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);

        const ordersRef = collection(db, "orders");
        const q = query(
            ordersRef,
            where("userId", "==", userID),
            where("orderDate", ">=", todayStart)
        );

        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
            const orderDoc = querySnapshot.docs[0];
            const orderData = orderDoc.data();
            
            if (!isFromPreviousDay(orderData.orderTimestamp)) {
                thankYouMessage.style.display = 'block';
                generateQRCode(orderData);
                submitButton.style.display = 'none';
            }
        }
    } catch (error) {
        console.error("Error checking existing order:", error);
    }
}

// Process order function
async function processOrder(userID) {
    try {
        const isTimeValid = isOrderingTime();
        const hasNoPreviousOrder = await checkPreviousOrder(userID, collection(db, "orders"));

        if (!isTimeValid) {
            alert("Order is closed. Please order between 6 AM - 10 AM or 7 PM - 9 PM.");
            return;
        }

        if (!hasNoPreviousOrder) {
            alert("You have already placed an order today.");
            return;
        }

        overlay.style.display = 'block';
        loadingSpinner.style.display = 'block';

        const userInfo = await getUserInfo(userID);
        if (!userInfo) {
            throw new Error("Could not get user info");
        }

        const orderDetails = {
            orderStatus: "ordered",
            orderDate: serverTimestamp(),
            orderTimestamp: new Date(),
            timeSlot: isOrderingTime() === true ? 
                (new Date().getHours() >= 6 && new Date().getHours() < 10 ? 'morning' : 'evening') 
                : 'unknown',
            userId: userID,
            ...userInfo
        };

        const orderRef = await addDoc(collection(db, "orders"), orderDetails);
        const savedOrder = await getOrderDetails(orderRef);
        
        thankYouMessage.style.display = 'block';
        generateQRCode(savedOrder);
        submitButton.style.display = 'none';
        localStorage.setItem('lastOrderTimestamp', new Date().toISOString());

    } catch (error) {
        console.error("Error processing order:", error);
        alert("There was an error processing your order. Please try again.");
        thankYouMessage.style.display = 'none';
    } finally {
        overlay.style.display = 'none';
        loadingSpinner.style.display = 'none';
    }
}

// Submit button event listener
submitButton.addEventListener("click", () => {
    auth.onAuthStateChanged((user) => {
        if (user) {
            processOrder(user.uid);
        } else {
            alert("Please log in to place an order");
        }
    });
});

// Check for existing order when page loads
auth.onAuthStateChanged((user) => {
    if (user) {
        checkAndDisplayExistingOrder(user.uid);
    }
});

// Plus button functionality
const plusButton = document.getElementById('plusButton');
const floatingMenu = document.getElementById('floatingMenu');

plusButton.addEventListener('click', () => {
    plusButton.classList.toggle('active');
    floatingMenu.classList.toggle('active');
});

// Close menu when clicking outside
document.addEventListener('click', (e) => {
    if (!plusButton.contains(e.target) && !floatingMenu.contains(e.target)) {
        plusButton.classList.remove('active');
        floatingMenu.classList.remove('active');
    }
});
