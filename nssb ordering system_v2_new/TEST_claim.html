    <script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    query, 
    where, 
    onSnapshot, 
    Timestamp, 
    getDocs,
    addDoc 
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyCno2NNkzt3gLdC4CfZ4TlhwESQJgI_IXk",
    authDomain: "test-login2-e4c7f.firebaseapp.com",
    projectId: "test-login2-e4c7f",
    storageBucket: "test-login2-e4c7f.appspot.com",
    messagingSenderId: "698181085162",
    appId: "1:698181085162:web:3b91954eb1779a05894cd2"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Collection references
const ordersRef = collection(db, "orders");
const claimedRef = collection(db, "claimed");

// Department configurations
const stampingDepartments = ['PROD-STAMPING', 'PPIC-STAMPING'];
const mainCanteenDepartments = ['IT', 'HCD', 'PROD', 'PPIC', 'QC', 'PURCH', 'MKTG', 'ME', 'ED', 'FNA', 'ENG'];

function isSameDate(date1, date2) {
    return date1.getFullYear() === date2.getFullYear() &&
           date1.getMonth() === date2.getMonth() &&
           date1.getDate() === date2.getDate();
}

async function getClaimedOrders(selectedDate) {
    const startOfDay = new Date(selectedDate);
    startOfDay.setHours(0, 0, 0, 0);
    const endOfDay = new Date(selectedDate);
    endOfDay.setHours(23, 59, 59, 999);

    const claimedQuery = query(
        claimedRef,
        where("timestamp", ">=", Timestamp.fromDate(startOfDay)),
        where("timestamp", "<=", Timestamp.fromDate(endOfDay))
    );

    try {
        const claimedSnapshot = await getDocs(claimedQuery);
        return claimedSnapshot.docs.map(doc => ({
            employeeId: doc.data().employeeId,
            timestamp: doc.data().timestamp.toDate()
        }));
    } catch (error) {
        console.error("Error fetching claimed orders:", error);
        return [];
    }
}

async function getOrdersByFilter(customDepartments = null) {
    try {
        const selectedDate = document.getElementById('datePicker').value;
        const selectedDepartment = document.getElementById('departmentFilter').value;
        const morningTimeBtn = document.getElementById('morningTimeBtn');
        const eveningTimeBtn = document.getElementById('eveningTimeBtn');

        if (!selectedDate) {
            alert("Please select a date");
            return;
        }

        const claimedOrders = await getClaimedOrders(selectedDate);

        let timeStart = new Date(selectedDate);
        let timeEnd = new Date(selectedDate);

        if (morningTimeBtn.classList.contains('active')) {
            timeStart.setHours(6, 0, 0, 0);
            timeEnd.setHours(10, 0, 0, 0);
        } else if (eveningTimeBtn.classList.contains('active')) {
            timeStart.setHours(19, 0, 0, 0);
            timeEnd.setHours(21, 0, 0, 0);
        } else {
            timeStart.setHours(0, 0, 0, 0);
            timeEnd.setHours(23, 59, 59, 999);
        }

        let q;
        if (customDepartments) {
            q = query(ordersRef,
                where("department", "in", customDepartments),
                where("orderDate", ">=", Timestamp.fromDate(timeStart)),
                where("orderDate", "<=", Timestamp.fromDate(timeEnd))
            );
        } else if (selectedDepartment) {
            q = query(ordersRef, 
                where("department", "==", selectedDepartment),
                where("orderDate", ">=", Timestamp.fromDate(timeStart)),
                where("orderDate", "<=", Timestamp.fromDate(timeEnd))
            );
        } else {
            q = query(ordersRef,
                where("orderDate", ">=", Timestamp.fromDate(timeStart)),
                where("orderDate", "<=", Timestamp.fromDate(timeEnd))
            );
        }

        const unsubscribe = onSnapshot(q, (querySnapshot) => {
            const orderTableBody = document.querySelector('#orderTable tbody');
            orderTableBody.innerHTML = '';
            let orderNumber = 1;

            if (querySnapshot.empty) {
                const newRow = orderTableBody.insertRow();
                const cell = newRow.insertCell(0);
                cell.colSpan = 6;
                cell.textContent = "No orders found for the selected criteria";
                cell.style.textAlign = "center";
                return;
            }

            querySnapshot.forEach((doc) => {
                const orderData = doc.data();
                const newRow = orderTableBody.insertRow();
                const orderTime = orderData.orderDate.toDate();
                const formattedTime = orderTime.toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const isClaimed = claimedOrders.some(claimed => 
                    claimed.employeeId === orderData.employeeId && 
                    isSameDate(claimed.timestamp, orderTime)
                );

                if (isClaimed) {
                    newRow.style.backgroundColor = '#90EE90';
                }

                newRow.insertCell(0).textContent = orderNumber++;
                newRow.insertCell(1).textContent = orderData.name;
                newRow.insertCell(2).textContent = orderData.employeeId;
                newRow.insertCell(3).textContent = orderData.department;
                newRow.insertCell(4).textContent = orderData.orderStatus;
                newRow.insertCell(5).textContent = formattedTime;
            });
        });

        if (window._currentUnsubscribe) {
            window._currentUnsubscribe();
        }
        window._currentUnsubscribe = unsubscribe;

    } catch (error) {
        console.error("Error in getOrdersByFilter:", error);
        alert("An error occurred while fetching orders. Please try again.");
    }
}

async function sendInformationToAdmin() {
    const infoText = document.getElementById('infoTextarea').value.trim();
    if (!infoText) {
        alert("Please enter information before sending.");
        return;
    }

    try {
        await addDoc(collection(db, "adminMessages"), {
            message: infoText,
            timestamp: Timestamp.now(),
            status: "unread"
        });
        alert("Information sent successfully to admin!");
        document.getElementById('infoTextarea').value = '';
    } catch (error) {
        console.error("Error sending information:", error);
        alert("Failed to send information. Please try again.");
    }
}

function formatDate(date) {
    const d = new Date(date);
    let month = '' + (d.getMonth() + 1);
    let day = '' + d.getDate();
    const year = d.getFullYear();

    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;

    return [year, month, day].join('-');
}

// Initialize event listeners when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
    const today = new Date();
    const formattedToday = formatDate(today);
    const datePicker = document.getElementById('datePicker');
    
    datePicker.value = formattedToday;
    datePicker.max = formattedToday;

    getOrdersByFilter();

    // Set up event listeners for filter controls
    document.getElementById('fetchOrders').addEventListener('click', () => getOrdersByFilter());
    document.getElementById('departmentFilter').addEventListener('change', () => {
        document.getElementById('stampingBtn').classList.remove('active');
        document.getElementById('mainCanteenBtn').classList.remove('active');
        getOrdersByFilter();
    });
    datePicker.addEventListener('change', () => getOrdersByFilter());

    // Set up time filter buttons
    const timeButtons = {
        morning: document.getElementById('morningTimeBtn'),
        evening: document.getElementById('eveningTimeBtn'),
        all: document.getElementById('allTimeBtn')
    };

    Object.entries(timeButtons).forEach(([key, button]) => {
        button.addEventListener('click', function() {
            Object.values(timeButtons).forEach(btn => btn.classList.remove('active'));
            this.classList.add('active');
            getOrdersByFilter();
        });
    });

    // Set up department filter buttons
    const stampingBtn = document.getElementById('stampingBtn');
    const mainCanteenBtn = document.getElementById('mainCanteenBtn');

    stampingBtn.addEventListener('click', () => {
        document.getElementById('departmentFilter').value = '';
        mainCanteenBtn.classList.remove('active');
        stampingBtn.classList.toggle('active');
        getOrdersByFilter(stampingBtn.classList.contains('active') ? stampingDepartments : null);
    });

    mainCanteenBtn.addEventListener('click', () => {
        document.getElementById('departmentFilter').value = '';
        stampingBtn.classList.remove('active');
        mainCanteenBtn.classList.toggle('active');
        getOrdersByFilter(mainCanteenBtn.classList.contains('active') ? mainCanteenDepartments : null);
    });

    // Set up send button
    document.getElementById('sendButton').addEventListener('click', sendInformationToAdmin);

    // Add legend for claimed orders
    const legend = document.createElement('div');
    legend.style.textAlign = 'center';
    legend.style.margin = '10px 0';
    legend.innerHTML = '<span style="background-color: #90EE90; padding: 5px 10px; border-radius: 5px;">Green rows indicate claimed orders</span>';
    document.querySelector('.order-table').insertAdjacentElement('beforebegin', legend);
});
</script>

</body>
</html>
