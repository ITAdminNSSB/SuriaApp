<script>
// Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
    authDomain: "suria-food-ordering-system.firebaseapp.com",
    projectId: "suria-food-ordering-system",
    storageBucket: "suria-food-ordering-system.firebasestorage.app",
    messagingSenderId: "204528329291",
    appId: "1:204528329291:web:cba270a2968e6d159963ce"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const MALAYSIA_TIME_ZONE = 'Asia/Kuala_Lumpur';

let html5QrcodeScanner;
let usingFrontCamera = false;
let isProcessingScan = false;
let authenticatedUserPromise = null;
const profileCache = new Map();
window.pendingScanData = null;

// Auth Helper
function waitForAuthenticatedUser() {
    if (auth.currentUser) return Promise.resolve(auth.currentUser);
    if (authenticatedUserPromise) return authenticatedUserPromise;

    authenticatedUserPromise = new Promise((resolve, reject) => {
        const timeoutId = setTimeout(() => {
            unsubscribe();
            authenticatedUserPromise = null;
            reject(new Error('Authentication timeout.'));
        }, 5000);

        const unsubscribe = auth.onAuthStateChanged((user) => {
            clearTimeout(timeoutId);
            unsubscribe();
            authenticatedUserPromise = null;
            if (user) resolve(user);
            else reject(new Error('Unauthenticated user.'));
        }, (error) => {
            clearTimeout(timeoutId);
            unsubscribe();
            authenticatedUserPromise = null;
            reject(error);
        });
    });

    return authenticatedUserPromise;
}

// Date Helpers
function getMalaysiaDateParts(d = new Date()) {
    const formatter = new Intl.DateTimeFormat('en-GB', {
        timeZone: MALAYSIA_TIME_ZONE,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    });
    const parts = formatter.formatToParts(d);
    const values = {};
    parts.forEach(part => {
        if (part.type !== 'literal') values[part.type] = part.value;
    });
    return values;
}

function getStrictDateString(d = new Date()) {
    const parts = getMalaysiaDateParts(d);
    return `${parts.year}-${parts.month}-${parts.day}`;
}

function getMalaysiaTimeString(d = new Date()) {
    return d.toLocaleTimeString('en-MY', {
        timeZone: MALAYSIA_TIME_ZONE,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
    });
}

function parseTimestamp(orderTimestamp) {
    try {
        if (orderTimestamp && typeof orderTimestamp === 'object' && typeof orderTimestamp.toDate === 'function') {
            return orderTimestamp.toDate();
        }
        if (orderTimestamp && typeof orderTimestamp === 'object' && 'seconds' in orderTimestamp) {
            return new Date(orderTimestamp.seconds * 1000);
        }
        if (orderTimestamp) {
            const parsed = new Date(orderTimestamp);
            return isNaN(parsed) ? null : parsed;
        }
        return null;
    } catch (e) { return null; }
}

function getOrderServiceDate(orderData) {
    if (orderData && typeof orderData.serviceDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(orderData.serviceDate)) {
        return orderData.serviceDate;
    }
    if (orderData && typeof orderData.orderDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(orderData.orderDate)) {
        return orderData.orderDate;
    }
    const orderDateObj = parseTimestamp(orderData ? orderData.orderDate : null);
    return orderDateObj ? getStrictDateString(orderDateObj) : null;
}

function extractProfileData(d) {
    if (!d) return { name: 'N/A', department: 'N/A' };
    const name = d.name || d.fullName || d.userName || d.employeeName || d.username || d.nama || d.Name || 'N/A';
    const department = d.department || d.dept || d.Department || d.bahagian || 'N/A';
    return { name, department };
}

async function getEmployeeProfile(employeeId) {
    if (!employeeId) return { name: 'N/A', department: 'N/A' };
    const empKey = String(employeeId).trim();
    if (profileCache.has(empKey)) return profileCache.get(empKey);

    try {
        const docDirect = await db.collection('users').doc(empKey).get();
        if (docDirect.exists) {
            const profile = extractProfileData(docDirect.data());
            if (profile.name !== 'N/A' || profile.department !== 'N/A') {
                profileCache.set(empKey, profile);
                return profile;
            }
        }

        for (const idVariant of idVariants(empKey)) {
            const snap = await db.collection('users').where('employeeId', '==', idVariant).limit(1).get();
            if (!snap.empty) {
                const profile = extractProfileData(snap.docs[0].data());
                profileCache.set(empKey, profile);
                return profile;
            }
        }

        const num = Number(empKey);
        if (!isNaN(num)) {
            const numSnap = await db.collection('users').where('employeeId', '==', num).limit(1).get();
            if (!numSnap.empty) {
                const profile = extractProfileData(numSnap.docs[0].data());
                profileCache.set(empKey, profile);
                return profile;
            }
        }

        const idSnap = await db.collection('users').where('id', '==', empKey).limit(1).get();
        if (!idSnap.empty) {
            const profile = extractProfileData(idSnap.docs[0].data());
            profileCache.set(empKey, profile);
            return profile;
        }
    } catch (err) {}

    const fallback = { name: 'N/A', department: 'N/A' };
    profileCache.set(empKey, fallback);
    return fallback;
}

// Returns the clean ID plus common messy variants (leading/trailing space)
function idVariants(cleanId) {
    const id = String(cleanId || '').trim();
    return [id, ' ' + id, id + ' '];
}

async function findOrderForScannedQr(employeeData) {
    await waitForAuthenticatedUser();

    const empId = String(employeeData.employeeId || '').trim();
    const qrOrderId = String(employeeData.orderId || '').trim();
    const qrServiceDate = employeeData.serviceDate || employeeData.orderDate || getStrictDateString();

    if (qrOrderId) {
        const directRef = db.collection('canteen_orders').doc(qrOrderId);
        const directSnap = await directRef.get();
        if (!directSnap.exists) return null;

        const data = directSnap.data();
        const storedEmpId = String(data.employeeId || '').trim();
        const storedServiceDate = getOrderServiceDate(data);

        if (storedEmpId && storedEmpId !== empId) return null;
        if (storedServiceDate && qrServiceDate && storedServiceDate !== qrServiceDate) return null;

        return { id: directSnap.id, ref: directRef, data };
    }

    let match = null;
    for (const idVariant of idVariants(empId)) {
        if (match) break;
        const snap = await db.collection('canteen_orders')
            .where('employeeId', '==', idVariant)
            .get();
        snap.forEach(docSnap => {
            if (match) return;
            const data = docSnap.data();
            const storedServiceDate = getOrderServiceDate(data);
            if (storedServiceDate === qrServiceDate) {
                match = { id: docSnap.id, ref: docSnap.ref, data };
            }
        });
    }
    return match;
}

async function checkDuplicateFast(empId) {
    try {
        await waitForAuthenticatedUser();
        const todayStr = getStrictDateString();
        for (const idVariant of idVariants(empId)) {
            const snap = await db.collection('canteen_claimed')
                .where('employeeId', '==', idVariant)
                .where('scannedDate', '==', todayStr)
                .limit(1)
                .get();
            if (!snap.empty) return true;
        }
        return false;
    } catch (e) {
        return false;
    }
}

function getPaymentBadge(method) {
    if (!method) method = 'Debt';
    let className = 'payment-badge';
    const mLower = method.toLowerCase();
    
    if (mLower.includes('debt')) className += ' debt';
    else if (mLower.includes('cash')) className += ' cash';
    else if (mLower.includes('qr')) className += ' qr';
    else if (mLower.includes('card')) className += ' card';
    
    return `<span class="${className}">${method}</span>`;
}

function updateResultDisplay(message, isSuccess = true) {
    const resultDiv = document.getElementById('result');
    if (resultDiv) {
        resultDiv.className = isSuccess ? 'success' : 'error';
        resultDiv.textContent = message;
        resultDiv.style.opacity = '1';
        
        if (isSuccess) {
            setTimeout(() => {
                resultDiv.classList.add('fade-out');
                setTimeout(() => {
                    resultDiv.textContent = '';
                    resultDiv.className = '';
                }, 500);
            }, 3000);
        }
    }
}

function showModal(title, message, isSuccess = false) {
    const modal = document.getElementById('duplicateModal');
    const modalTitle = modal.querySelector('h2');
    const modalMessage = modal.querySelector('p');
    
    modalTitle.innerHTML = title;
    modalMessage.innerHTML = message;
    
    if (isSuccess) {
        modal.classList.add('success-modal');
    } else {

    }

function closeDuplicateModal() {
    const modal = document.getElementById('duplicateModal');
    modal.style.display = 'none';
    modal.classList.remove('success-modal');
    isProcessingScan = false;
    // Was checking getState() === 2 (SCANNING) before resuming — but the camera
    // is actually PAUSED (state 3) at this point, so resume() never fired.
    try { if (html5QrcodeScanner) html5QrcodeScanner.resume(); } catch(e) {}
}

function closePaymentConfirmModal() {
    document.getElementById('paymentConfirmModal').style.display = 'none';
    window.pendingScanData = null;
    isProcessingScan = false;
    try { if (html5QrcodeScanner) html5QrcodeScanner.resume(); } catch(e) {}
}

// QR Scanner Setup and Camera Logic
function initQRScanner() {
    if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
    }
    
    html5QrcodeScanner = new Html5Qrcode("reader");
    
    const config = {
        fps: 15,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ],
        rememberLastUsedCamera: true,
        showTorchButtonIfSupported: true,
        showZoomSliderIfSupported: true,
    };
    
    html5QrcodeScanner.start(
        { facingMode: usingFrontCamera ? "user" : "environment" },
        config,
        onScanSuccess,
        onScanFailure
    ).catch(err => {
        console.error("Camera start error:", err);
        updateResultDisplay("Camera error: " + err.message, false);
    });
    
    const scannerArea = document.getElementById('reader');
    if (scannerArea && !scannerArea.querySelector('.scan-overlay')) {
        const scanFrameOverlay = document.createElement('div');
        scanFrameOverlay.className = 'scan-overlay';
        scanFrameOverlay.innerHTML = '<div class="scan-frame"></div><div class="scan-line"></div>';
        scannerArea.appendChild(scanFrameOverlay);
    }
}

function setupScannerUI() {
    const readerDiv = document.getElementById('reader');
    if (readerDiv) {
        readerDiv.innerHTML = '';
        
        const cameraContainer = document.createElement('div');
        cameraContainer.className = 'camera-container';
        readerDiv.appendChild(cameraContainer);
        
        const cameraControls = document.createElement('div');
        cameraControls.className = 'camera-controls';
        cameraControls.innerHTML = `
            <button id="switchCamera" class="camera-button">
                <i class="fas fa-sync-alt"></i>
            </button>
            <button id="toggleFlash" class="camera-button">
                <i class="fas fa-bolt"></i>
            </button>
        `;
        readerDiv.appendChild(cameraControls);
        
        const cameraIndicator = document.createElement('div');
        cameraIndicator.id = 'cameraIndicator';
        cameraIndicator.className = 'camera-indicator';
        cameraIndicator.innerHTML = 'Using back camera';
        readerDiv.appendChild(cameraIndicator);
        
        setTimeout(() => {
            document.getElementById('switchCamera')?.addEventListener('click', toggleCamera);
            document.getElementById('toggleFlash')?.addEventListener('click', toggleFlash);
        }, 1000);
    }
}

async function toggleCamera() {
    const indicator = document.getElementById('cameraIndicator');
    const switchBtn = document.getElementById('switchCamera');
    
    if (switchBtn) {
        switchBtn.disabled = true;
        switchBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
    }
    
    try {
        if (html5QrcodeScanner) {
            await html5QrcodeScanner.stop();
            usingFrontCamera = !usingFrontCamera;
            if (indicator) {
                indicator.textContent = usingFrontCamera ? 'Using front camera' : 'Using back camera';
            }
            initQRScanner();
        }
    } catch (error) {
        console.error("Error toggling camera:", error);
        updateResultDisplay("Camera switch failed.", false);
        usingFrontCamera = !usingFrontCamera;
        if (indicator) indicator.textContent = usingFrontCamera ? 'Using front camera' : 'Using back camera';
        initQRScanner();
    } finally {
        if (switchBtn) {
            switchBtn.disabled = false;
            switchBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
        }
    }
}

let flashOn = false;
async function toggleFlash() {
    const flashButton = document.getElementById('toggleFlash');
    
    if (flashButton) {
        flashButton.disabled = true;
        flashButton.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
    }
    
    try {
        if (html5QrcodeScanner) {
            if (flashOn) {
                await html5QrcodeScanner.turnOffFlash();
                flashOn = false;
            } else {
                await html5QrcodeScanner.turnOnFlash();
                flashOn = true;
            }
            
            if (flashButton) {
                flashButton.innerHTML = flashOn ? 
                    '<i class="fas fa-bolt flash-on"></i>' : 
                    '<i class="fas fa-bolt"></i>';
            }
        }
    } catch (err) {
        console.log("Flash not supported or error:", err);
        if (err.toString().includes("not supported")) {
            updateResultDisplay("Flash is not supported", false);
        }
    } finally {
        if (flashButton) flashButton.disabled = false;
    }
}

function onScanFailure(error) {
    if (error.includes("permission")) {
        updateResultDisplay(error, false);
    }
}

// Advanced Database Logic on Scan Success
async function onScanSuccess(decodedText, decodedResult) {
    if (isProcessingScan) return;
    isProcessingScan = true;

    // Try pausing scanner while evaluating
    try {
        if (html5QrcodeScanner && html5QrcodeScanner.getState() === 2) {
            html5QrcodeScanner.pause();
        }
    } catch (e) {}

    try {
        if (navigator.vibrate) navigator.vibrate(100);

        const scanLine = document.querySelector('.scan-line');
        if (scanLine) {
            scanLine.classList.add('success-scan');
            setTimeout(() => scanLine.classList.remove('success-scan'), 1000);
        }

        let employeeData;
        try {
            const cleanedText = String(decodedText)
                .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
                .replace(/[\u2018\u2019\u2032]/g, "'")
                .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ')
                .trim();
            employeeData = JSON.parse(cleanedText);
        } catch (e) {
            updateResultDisplay('Invalid QR Code format.', false);
            throw new Error('Invalid JSON');
        }

        if (!employeeData || !employeeData.employeeId) {
            updateResultDisplay('Invalid QR: Employee ID missing.', false);
            throw new Error('Missing ID');
        }

        const todayStr = getStrictDateString(new Date());
        const qrServiceDate = employeeData.serviceDate || employeeData.orderDate || '';

        if (qrServiceDate && qrServiceDate !== todayStr) {
            showModal('QR Code Expired', `QR Code ini telah <strong>tamat tempoh</strong>.<br><br>Tarikh pada QR Code: <strong style="color:red;">${qrServiceDate}</strong><br><br>Sila minta staf buka *Order Page* dan tunjuk QR Code untuk hari ini.`);
            throw new Error('Expired');
        }

        const [verifiedOrder, profile] = await Promise.all([
            findOrderForScannedQr(employeeData),
            getEmployeeProfile(employeeData.employeeId)
        ]);

        if (!verifiedOrder) {
            showModal('Order Not Found', 'Tiada pesanan sah untuk pekerja ini bagi hari ini. Sila semak Order Page sebelum menyerahkan makanan.');
            updateResultDisplay('Order not found in Firestore.', false);
            throw new Error('No Order');
        }

        const orderData = verifiedOrder.data;
        const storedServiceDate = getOrderServiceDate(orderData);
        const storedEmployeeId = String(orderData.employeeId || '').trim();
        const scannedEmployeeId = String(employeeData.employeeId || '').trim();
        const currentClaimStatus = String(orderData.claimStatus || 'pending').trim().toLowerCase();

        if (storedEmployeeId && storedEmployeeId !== scannedEmployeeId) {
            showModal('Invalid QR Code', 'Employee ID pada QR tidak sepadan dengan pesanan sebenar dalam sistem.');
            updateResultDisplay('Employee mismatch.', false);
            throw new Error('Mismatch');
        }

        if (storedServiceDate && storedServiceDate !== todayStr) {
            showModal('Order Date Invalid', `Pesanan ini adalah untuk <strong>${storedServiceDate}</strong>, bukan hari ini.`);
            updateResultDisplay('Order not valid for today.', false);
            throw new Error('Wrong Date');
        }

        if (currentClaimStatus !== 'pending') {
            showModal('Duplicate Scan', `Status pesanan ini ialah <strong>${currentClaimStatus.toUpperCase()}</strong>. Pesanan tidak boleh diimbas semula.`);
            updateResultDisplay('Order already processed.', false);
            throw new Error('Duplicate Status');
        }

        const isDuplicate = await checkDuplicateFast(scannedEmployeeId);
        if (isDuplicate) {
            showModal('Duplicate Scan', 'Pekerja ini telah membuat imbasan (claim) hari ini.');
            throw new Error('Duplicate Scan');
        }

        let resolvedName = orderData.name || employeeData.name;
        if (!resolvedName || resolvedName === 'N/A' || String(resolvedName).trim() === '') resolvedName = profile.name;

        let resolvedDept = orderData.department || employeeData.department;
        if (!resolvedDept || resolvedDept === 'N/A' || String(resolvedDept).trim() === '') resolvedDept = profile.department;

        const verifiedEmployeeData = {
            orderId: verifiedOrder.id,
            employeeId: storedEmployeeId || scannedEmployeeId,
            employeeUserId: orderData.userId || '',
            orderDate: storedServiceDate || todayStr,
            serviceDate: storedServiceDate || todayStr,
            orderShift: orderData.orderShift || employeeData.orderShift || '',
            mealSet: orderData.mealSet || employeeData.mealSet || 'N/A',
            location: orderData.location || employeeData.location || 'N/A',
            department: resolvedDept,
            name: resolvedName,
            orderTimestamp: orderData.orderDate || null,
            mealType: orderData.mealType || '',
            mealPrice: Number(orderData.mealPrice ?? 7.50),
            nssbSubsidy: Number(orderData.nssbSubsidy ?? 5.50),
            employeeContribution: Number(orderData.employeeContribution ?? 2.00),
            vendorClaimClaimed: Number(orderData.vendorClaimClaimed ?? orderData.nssbSubsidy ?? 5.50),
            vendorClaimUnclaimed: Number(orderData.vendorClaimUnclaimed ?? 7.50),
            scanFailureDeduction: Number(orderData.scanFailureDeduction ?? 2.00)
        };

        const infoDiv = document.getElementById('confirmScanInfo');
        infoDiv.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="color:#64748b; font-size:0.9rem;">Name</span>
                <strong style="color:#0C0E8B;">${resolvedName}</strong>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="color:#64748b; font-size:0.9rem;">Employee ID</span>
                <strong>${verifiedEmployeeData.employeeId}</strong>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="color:#64748b; font-size:0.9rem;">Department</span>
                <strong>${resolvedDept}</strong>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:0; padding-top:10px; border-top:1px dashed #cbd5e1;">
                <span style="color:#64748b; font-size:0.9rem;">Menu Pilihan</span>
                <span class="payment-badge" style="background:#f1f5f9;border:1px solid #cbd5e1;color:#475569;font-weight:800;">${verifiedEmployeeData.mealSet}</span>
            </div>
        `;

        window.pendingScanData = {
            employeeData: verifiedEmployeeData,
            orderId: verifiedOrder.id,
            resolvedName,
            resolvedDept
        };
        
        document.getElementById('paymentConfirmModal').style.display = 'flex';

    } catch (error) {
        console.error('Scan validation error:', error);
        isProcessingScan = false;
        try { if (html5QrcodeScanner) html5QrcodeScanner.resume(); } catch(e) {}
    }
}

// Payment Submission Transaction
window.submitScanPayment = async function(selectedPaymentMethod) {
    if (!window.pendingScanData) return;

    document.getElementById('paymentConfirmModal').style.display = 'none';

    const { employeeData, orderId, resolvedName, resolvedDept } = window.pendingScanData;
    const localNow = new Date();

    try {
        const currentUser = await waitForAuthenticatedUser();
        const scannerEmail = currentUser.email || 'unknown_vendor';
        const scannerUid = currentUser.uid;

        if (!orderId) throw new Error('ORDER_ID_MISSING');

        const orderRef = db.collection('canteen_orders').doc(orderId);
        const claimRef = db.collection('canteen_claimed').doc(orderId);

        const isDebt = String(selectedPaymentMethod || '').toLowerCase() === 'debt';

        await db.runTransaction(async (transaction) => {
            const orderSnap = await transaction.get(orderRef);
            if (!orderSnap.exists) throw new Error('ORDER_NOT_FOUND');

            const claimSnap = await transaction.get(claimRef);
            if (claimSnap.exists) throw new Error('DUPLICATE_CLAIM');

            const liveOrder = orderSnap.data();
            const liveEmployeeId = String(liveOrder.employeeId || '').trim();
            const expectedEmployeeId = String(employeeData.employeeId || '').trim();
            const liveServiceDate = getOrderServiceDate(liveOrder);
            const todayStr = getStrictDateString(localNow);
            const liveClaimStatus = String(liveOrder.claimStatus || 'pending').trim().toLowerCase();

            if (liveEmployeeId && liveEmployeeId !== expectedEmployeeId) throw new Error('EMPLOYEE_MISMATCH');
            if (liveServiceDate && liveServiceDate !== todayStr) throw new Error('ORDER_DATE_INVALID');
            if (liveClaimStatus !== 'pending') throw new Error('ORDER_ALREADY_PROCESSED');

            const mealPrice = Number(liveOrder.mealPrice ?? employeeData.mealPrice ?? 7.50);
            const nssbSubsidy = Number(liveOrder.nssbSubsidy ?? employeeData.nssbSubsidy ?? 5.50);
            const employeeContribution = Number(liveOrder.employeeContribution ?? employeeData.employeeContribution ?? 2.00);
            const vendorClaimAmount = Number(liveOrder.vendorClaimClaimed ?? employeeData.vendorClaimClaimed ?? nssbSubsidy);
            const employeeDebtAmount = isDebt ? employeeContribution : 0.00;
            const employeePaymentAmount = isDebt ? 0.00 : employeeContribution;
            const employeePaymentStatus = isDebt ? 'debt' : 'paid_on_spot';
            const orderDateObj = parseTimestamp(liveOrder.orderDate) || localNow;

            const scanData = {
                orderId: orderSnap.id,
                employeeId: liveEmployeeId || expectedEmployeeId,
                employeeUserId: liveOrder.userId || employeeData.employeeUserId || '',
                name: liveOrder.name || resolvedName,
                department: liveOrder.department || resolvedDept,
                location: liveOrder.location || employeeData.location || 'N/A',
                mealSet: liveOrder.mealSet || employeeData.mealSet || 'N/A',
                mealType: liveOrder.mealType || employeeData.mealType || '',
                orderShift: liveOrder.orderShift || employeeData.orderShift || '',
                serviceDate: liveServiceDate || todayStr,
                orderDate: liveServiceDate || todayStr,
                orderTimestamp: orderDateObj.toISOString(),
                claimStatus: 'claimed',
                claimCategory: 'claimed_meal',
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                scannedDate: todayStr,
                scannedTime: getMalaysiaTimeString(localNow),
                paymentMethod: selectedPaymentMethod,
                employeePaymentStatus: employeePaymentStatus,
                employeePaymentAmount: employeePaymentAmount,
                employeeDebtAmount: employeeDebtAmount,
                mealPrice: mealPrice,
                nssbSubsidy: nssbSubsidy,
                employeeContribution: employeeContribution,
                vendorClaimAmount: vendorClaimAmount,
                invoiceClaimAmount: vendorClaimAmount,
                scanFailureDeduction: Number(liveOrder.scanFailureDeduction ?? employeeData.scanFailureDeduction ?? 2.00),
                scannedByEmail: scannerEmail,
                scannedByUid: scannerUid,
                vendorEmail: scannerEmail,
                vendorUserId: scannerUid,
                userId: scannerUid
            };

            const chargeAmt = isDebt ? employeeContribution : 0.00;

            transaction.set(claimRef, scanData);
            transaction.update(orderRef, {
                claimStatus: 'claimed',
                finalCharge: chargeAmt,
                paymentMethod: selectedPaymentMethod,
                employeePaymentStatus: employeePaymentStatus,
                employeePaymentAmount: employeePaymentAmount,
                employeeDebtAmount: employeeDebtAmount,
                mealPrice: mealPrice,
                nssbSubsidy: nssbSubsidy,
                employeeContribution: employeeContribution,
                vendorClaimAmount: vendorClaimAmount,
                claimedByUserId: scannerUid,
                claimedByEmail: scannerEmail,
                claimedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });

        showModal('Scan & Payment Saved', `Berjaya merekodkan tuntutan makanan.<br><br>Name: <strong>${resolvedName}</strong><br>Payment: <strong>${selectedPaymentMethod}</strong>`, true);
        updateResultDisplay(`Successfully recorded: ${resolvedName}`);
        
        loadTodaysScanHistory();

    } catch (error) {
        console.error('Error saving payment / claim:', error);
        const code = String(error && error.message ? error.message : '');
        if (code.includes('DUPLICATE_CLAIM') || code.includes('ORDER_ALREADY_PROCESSED')) {
            showModal('Duplicate Scan', 'Pesanan ini telah diproses. Tiada transaksi direkodkan.');
        } else if (code.includes('ORDER_NOT_FOUND')) {
            showModal('Order Not Found', 'Pesanan tidak lagi wujud dalam sistem.');
        } else if (code.includes('EMPLOYEE_MISMATCH')) {
            showModal('Invalid QR Code', 'Employee ID tidak sepadan dengan pesanan dalam Firestore.');
        } else if (code.includes('ORDER_DATE_INVALID')) {
            showModal('Order Date Invalid', 'Pesanan ini bukan untuk tarikh hari ini.');
        } else {
            updateResultDisplay('Gagal menyimpan rekod. Sila cuba lagi.', false);
        }
    } finally {
        window.pendingScanData = null;
        // Always resume — the previous check (skip resuming while the
        // shared modal was visible) also blocked resuming after a *successful*
        // claim, since the success message reuses the same modal element.
        setTimeout(() => { 
            isProcessingScan = false;
            try { if (html5QrcodeScanner) html5QrcodeScanner.resume(); } catch(e) {}
        }, 500);
    }
};

// Updated load history using canteen_claimed (without triggering index error)
async function loadTodaysScanHistory() {
    const scanHistoryBody = document.getElementById('scanHistoryBody');
    if (!scanHistoryBody) return;

    try {
        await waitForAuthenticatedUser();
        const todayStr = getStrictDateString();

        // Removed .orderBy() to avoid the composite index requirement
        const querySnapshot = await db.collection('canteen_claimed')
            .where('scannedDate', '==', todayStr)
            .get();

        scanHistoryBody.innerHTML = '';

        if (querySnapshot.empty) {
            scanHistoryBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No scans found for today</td></tr>';
            return;
        }

        // Store data in an array and sort it client-side
        const list = [];
        querySnapshot.forEach(doc => list.push(doc.data()));
        list.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

        list.forEach((data) => {
            const paymentMethod = data.paymentMethod || 'Debt';
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${data.employeeId || 'N/A'}</td>
                <td><strong>${data.name || 'N/A'}</strong></td>
                <td>${data.department || 'N/A'}</td>
                <td>${data.scannedTime || 'N/A'}</td>
                <td>${data.mealSet || 'N/A'}</td>
                <td>${getPaymentBadge(paymentMethod)}</td>
            `;
            scanHistoryBody.appendChild(row);
        });

    } catch (error) {
        console.error('Error loading scan history:', error);
        scanHistoryBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Error loading scan history</td></tr>';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    setupScannerUI();
    initQRScanner();
    loadTodaysScanHistory();
    
    const closeModalBtns = document.querySelectorAll('.close-modal');
    closeModalBtns.forEach(btn => {
        if (!btn.onclick) {
            btn.onclick = function() {
                if(this.closest('#duplicateModal')) closeDuplicateModal();
                if(this.closest('#paymentConfirmModal')) closePaymentConfirmModal();
            };
        }
    });

    window.onclick = function(event) {
        const dModal = document.getElementById('duplicateModal');
        const pModal = document.getElementById('paymentConfirmModal');
        if (event.target === dModal) closeDuplicateModal();
        if (event.target === pModal) closePaymentConfirmModal();
    };
});
</script>
</body>
</html>
