<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ FIX 1: Cache-busting — forces browsers to always load latest code -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="auth-guard.js"></script>
    <title>Order Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica', sans-serif;
            background-color: #f0f0f0;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: linear-gradient(135deg, black, #334155);
            color: white;
            position: sticky;
            top: 20px;
            border-radius: 15px;
            width: calc(100% - 40px);
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .header img {
            width: 100px;
            height: 50px;
            margin-left: auto;
            margin-right: auto;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin: 30px auto;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(12, 14, 139, 0.1);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(12, 14, 139, 0.15);
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(135deg, black, #334155);
        }

        .calendar-container { margin-bottom: 25px; }

        .calendar-container h2 {
            color: #0C0E8B;
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        #calendar {
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            padding: 15px;
            background: rgba(12, 14, 139, 0.05);
            border-radius: 12px;
            margin-top: 10px;
        }

        .order-section {
            padding: 20px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        .order-question {
            font-size: 1.3rem;
            color: #0C0E8B;
            margin-bottom: 25px;
            font-weight: 500;
            text-align: center;
        }

        .order-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .order-buttons button {
            padding: 12px 35px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .yes-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; }
        .yes-btn:hover { background: linear-gradient(135deg, #20c997, #28a745); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(40, 167, 69, 0.2); }
        .no-btn  { background: linear-gradient(135deg, #dc3545, #f86b7d); color: white; }
        .no-btn:hover  { background: linear-gradient(135deg, #f86b7d, #dc3545); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(220, 53, 69, 0.2); }

        /* Meal Set */
        .meal-sets { display: none; margin: 20px 0; }
        .meal-set-title { font-size: 1.2rem; color: #0C0E8B; margin-bottom: 15px; font-weight: 500; }
        .meal-set-option {
            background: white; border: 2px solid #0C0E8B; color: #0C0E8B;
            padding: 15px 25px; margin: 10px 0; border-radius: 10px;
            cursor: pointer; width: 100%; transition: all 0.3s ease;
            font-size: 0.95rem; font-weight: 500;
        }
        .meal-set-option:hover  { background: #0C0E8B; color: white; }
        .meal-set-option.selected { background: #0C0E8B; color: white; }

        /* Location */
        .location-selection { display: none; margin: 20px 0; }
        .location-title { font-size: 1.2rem; color: #0C0E8B; margin-bottom: 15px; font-weight: 500; }
        .location-option {
            background: white; border: 2px solid #5BA7E1; color: #5BA7E1;
            padding: 15px 25px; margin: 10px 0; border-radius: 10px;
            cursor: pointer; width: 100%; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .location-option:hover   { background: #5BA7E1; color: white; }
        .location-option.selected { background: #5BA7E1; color: white; }
        .location-option i { font-size: 1.2rem; }

        .location-warning {
            background-color: rgba(255, 193, 7, 0.1);
            border: 2px solid #ffc107; color: #856404;
            padding: 12px; border-radius: 8px; margin-top: 15px;
            font-size: 0.9rem; font-weight: 500; display: none;
        }

        /* Submit — hidden until location chosen (Step 3) */
        #submitOrder {
            display: none;
            background: linear-gradient(135deg, #5BA7E1, #4a90e2);
            color: white; padding: 15px 40px; font-size: 1.1rem;
            border: none; border-radius: 30px; cursor: pointer;
            margin-top: 20px; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px; font-weight: 500;
            box-shadow: 0 4px 15px rgba(91, 167, 225, 0.2);
            width: 80%; max-width: 300px;
        }
        #submitOrder:hover { background: linear-gradient(135deg, #4a90e2, #5BA7E1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91, 167, 225, 0.3); }

        #time-message {
            margin-top: 15px; font-size: 0.9rem; padding: 10px;
            border-radius: 8px; background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545; font-weight: 500; display: none;
        }

        /* Thank-you popup */
        .thank-you-container {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center; display: none; z-index: 1000; min-width: 300px;
        }
        .thank-you-container h2 { color: #0C0E8B; margin-bottom: 15px; }
        .thank-you-container p  { color: #666; margin-bottom: 20px; }
        .thank-you-container > i { color: #28a745; font-size: 48px; margin-bottom: 20px; display: block; }

        /* ── Colour-coded badges (match view orders page) ── */
        .order-info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 6px 0;
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
        }

        .mealset-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .mealset-a { background-color: #d1fae5; color: #065f46; }   /* green  — Set A */
        .mealset-b { background-color: #fef3c7; color: #92400e; }   /* amber  — Set B */
        .mealset-unknown { background-color: #f3f4f6; color: #6b7280; }

        .location-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .location-pekan   { background-color: #dbeafe; color: #1e40af; }  /* blue — Pekan Subang */
        .location-kristal { background-color: #fce7f3; color: #be185d; }  /* pink — Subang Kristal */
        .location-other   { background-color: #f3f4f6; color: #6b7280; }

        /* Loading & overlay */
        .loading-spinner {
            display: none; width: 40px; height: 40px; margin: 20px auto;
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; z-index: 999;
        }

        /* QR */
        #qrcode { margin: 20px auto; padding: 10px; background: white; border-radius: 8px; width: fit-content; }
        .qr-instruction { color: #666; font-size: 0.9em; margin: 10px 0; }
        .download-btn {
            background: #0C0E8B; color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer;
            margin-top: 10px; transition: background 0.3s ease;
        }
        .download-btn:hover { background: #1416a0; }

        /* Bottom nav */
        .nav-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: white; padding: 15px 20px 20px;
            display: flex; justify-content: space-between;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.08); z-index: 90;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: #94a3b8; transition: all 0.3s ease;
            cursor: pointer; flex: 1; position: relative; padding: 8px 0;
        }
        .nav-item.active { color: #334155; }
        .nav-item.active::before {
            content: ''; position: absolute; top: -15px; left: 50%;
            transform: translateX(-50%); width: 5px; height: 5px;
            background: #334155; border-radius: 50%;
        }
        .nav-item i       { font-size: 20px; margin-bottom: 6px; transition: all 0.3s ease; }
        .nav-item:hover i { transform: translateY(-3px); }
        .nav-item span    { font-size: 12px; font-weight: 500; }
        .nav-item:hover span { color: #334155; }

        @media (max-width: 480px) {
            .container { width: 95%; padding: 20px; }
            .order-buttons { flex-direction: column; gap: 15px; }
            .order-buttons button { width: 100%; }
            .thank-you-container { width: 90%; padding: 20px; }
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="overlay" id="overlay"></div>

    <div class="header">
        <img src="pictures/new.png" alt="App Logo">
    </div>

    <div class="container">
        <div class="calendar-container">
            <h2>Today's Date</h2>
            <div id="calendar"></div>
        </div>
    </div>

    <div class="container">
        <div class="order-section">
            <p class="order-question">Do you want to order food today?</p>
            <div class="order-buttons">
                <button class="yes-btn" onclick="handleYesClick()">Yes</button>
                <button class="no-btn"  onclick="handleNoClick()">No</button>
            </div>

            <!-- Step 1: Meal Set -->
            <div class="meal-sets" id="mealSets">
                <p class="meal-set-title">Please select A OR B</p>
                <button class="meal-set-option" data-set="A">( A ) NON-MUSLIM , অমুসলিম ,गैर-मुस्लिम</button>
                <button class="meal-set-option" data-set="B">( B ) MUSLIM , মুসলিম, मुस्लिम</button>
            </div>

            <!-- Step 2: Location -->
            <div class="location-selection" id="locationSelection">
                <p class="location-title">Select Your Eating Location *</p>
                <button class="location-option" data-location="PEKAN SUBANG">
                    <i class="fas fa-map-marker-alt"></i> PEKAN SUBANG
                </button>
                <button class="location-option" data-location="SUBANG KRISTAL">
                    <i class="fas fa-map-marker-alt"></i> SUBANG KRISTAL
                </button>
                <div class="location-warning" id="locationWarning">
                    <i class="fas fa-exclamation-triangle"></i> Please select a location to continue
                </div>
            </div>

            <!-- Step 3: Submit -->
            <button id="submitOrder">Submit Order</button>
            <p id="time-message"></p>
            <div class="loading-spinner" id="loadingSpinner"></div>
        </div>
    </div>

    <!-- Thank-you popup -->
    <div class="thank-you-container" id="thankYouMessage">
        <i class="fas fa-check-circle"></i>
        <h2>Thank You!</h2>
        <p>Your order has been successfully placed.</p>

        <!-- Colour-coded meal set badge -->
        <div class="order-info-row" id="mealSetDisplay" style="display:none;">
            <span>Meal Set:</span>
            <span id="selectedMealBadge"></span>
        </div>

        <!-- Colour-coded location badge -->
        <div class="order-info-row" id="locationDisplay" style="display:none;">
            <span>Location:</span>
            <span id="selectedLocationBadge"></span>
        </div>

        <div id="qrcode"></div>
        <p class="qr-instruction">Show this QR code when collecting your food</p>
        <button class="download-btn" id="downloadQR">Download QR Code</button>
    </div>

        <a href="home.html" class="nav-item">
            <i class="fas fa-home"></i>

        <a href="menu_pg.html" class="nav-item">

            <span>Menu</span>

            <i class="fas fa-user"></i>
            <span>Profile</span>

            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp, query, where, getDocs, deleteDoc, Timestamp }
            from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey:            "AIzaSyA_eTabpa9spioE_pGOJUZ-wRM4rIvLKGA",
            authDomain:        "suria-food-ordering-system.firebaseapp.com",
            projectId:         "suria-food-ordering-system",
            storageBucket:     "suria-food-ordering-system.firebasestorage.app",
            messagingSenderId: "204528329291",
            appId:             "1:204528329291:web:cba270a2968e6d159963ce"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // DOM refs 
        const submitButton      = document.getElementById('submitOrder');
        const thankYouMessage   = document.getElementById('thankYouMessage');
        const overlay           = document.getElementById('overlay');
        const loadingSpinner    = document.getElementById('loadingSpinner');
        const timeMessage       = document.getElementById('time-message');
        const calendarElement   = document.getElementById('calendar');
        const locationSelection = document.getElementById('locationSelection');
        const mealSetsContainer = document.getElementById('mealSets');
        const locationWarning   = document.getElementById('locationWarning');

        // Badge elements in thank-you popup
        const mealSetDisplay        = document.getElementById('mealSetDisplay');
        const selectedMealBadge     = document.getElementById('selectedMealBadge');
        const locationDisplay       = document.getElementById('locationDisplay');
        const selectedLocationBadge = document.getElementById('selectedLocationBadge');

        // State 
        let selectedMealSet  = null;
        let selectedLocation = null;

        // Badge builders — match view orders colour scheme
        function getMealSetBadgeHTML(mealSet) {
            if (mealSet === 'A') return '<span class="mealset-badge mealset-a">Set A (NON-MUSLIM)</span>';
            if (mealSet === 'B') return '<span class="mealset-badge mealset-b">Set B (MUSLIM)</span>';
            return '<span class="mealset-badge mealset-unknown">—</span>';
        }

        function getLocationBadgeHTML(location) {
            if (location === 'PEKAN SUBANG')   return '<span class="location-badge location-pekan">PEKAN SUBANG</span>';
            if (location === 'SUBANG KRISTAL') return '<span class="location-badge location-kristal">SUBANG KRISTAL</span>';
            if (location)                      return `<span class="location-badge location-other">${location}</span>`;
            return '';
        }

        // Render order info in thank-you popup 
        function displayOrderInfo(location, mealSet) {
            if (mealSet) {
                selectedMealBadge.innerHTML  = getMealSetBadgeHTML(mealSet);
                mealSetDisplay.style.display = 'flex';
            } else {
                mealSetDisplay.style.display = 'none';
            }

            if (location) {
                selectedLocationBadge.innerHTML = getLocationBadgeHTML(location);
                locationDisplay.style.display   = 'flex';
            } else {
                locationDisplay.style.display = 'none';
            }
        }

        // Server time
        async function getCurrentServerTime() {
            try {
                const ref  = await addDoc(collection(db, "timestamps"), { timestamp: serverTimestamp() });
                const snap = await getDoc(ref);
                const t    = snap.data().timestamp.toDate();
                await deleteDoc(ref);
                return t;
            } catch { return new Date(); }
        }

        // Calendar
        async function updateCalendarDisplay() {
            const today   = await getCurrentServerTime();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            calendarElement.textContent = today.toLocaleDateString('en-US', options);
        }

        // Ordering window
        async function isOrderingTime() {
            const t  = await getCurrentServerTime();
            const ms = new Date(t).setHours(4,  0,  0, 0);
            const me = new Date(t).setHours(10, 0,  0, 0);
            const ns = new Date(t).setHours(16, 0,  0, 0);
            const ne = new Date(t).setHours(21, 0,  0, 0);
            return {
                isValid:        (t >= ms && t <= me) || (t >= ns && t <= ne),
                isMorningShift:  t >= ms && t <= me,
                isNightShift:    t >= ns && t <= ne
            };
        }

        function displayTimeMessage(message) {
            if (message) { timeMessage.textContent = message; timeMessage.style.display = 'block'; }
            else          { timeMessage.textContent = '';      timeMessage.style.display = 'none';  }
        }

        // LocalStorage helpers
        function storeOrderData(orderData) {
            const toStore = {
                ...orderData,
                orderDate: orderData.orderDate && typeof orderData.orderDate.toDate === 'function'
                    ? orderData.orderDate.toDate().toISOString() : orderData.orderDate,
                orderTimestamp: new Date().toISOString()
            };
            localStorage.setItem('orderData', JSON.stringify(toStore));
            localStorage.setItem('orderDate', new Date().toISOString());
        }

        async function isStoredOrderFromToday() {
            const stored = localStorage.getItem('orderDate');
            if (!stored) return false;
            const now = await getCurrentServerTime();
            const d   = new Date(stored);
            return d.getDate()     === now.getDate()  &&
                   d.getMonth()    === now.getMonth() &&
                   d.getFullYear() === now.getFullYear();
        }

        function clearStoredOrderData() {
            localStorage.removeItem('orderData');
            localStorage.removeItem('orderDate');
        }

        // Clone helper — wipes stale event listeners
        function cloneAndReplace(selector) {
            document.querySelectorAll(selector).forEach(el => {
                const fresh = el.cloneNode(true);
                el.parentNode.replaceChild(fresh, el);
            });
        }

        // Step 1 — Meal set
        function setupMealSetSelection() {
            cloneAndReplace('.meal-set-option');
            selectedMealSet  = null;
            selectedLocation = null;

            document.querySelectorAll('.meal-set-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.meal-set-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedMealSet = option.dataset.set;
                    selectedLocation = null;
                    document.querySelectorAll('.location-option').forEach(o => o.classList.remove('selected'));
                    submitButton.style.display    = 'none';
                    locationWarning.style.display = 'none';
                    locationSelection.style.display = 'block';
                    displayTimeMessage('');
                    setupLocationSelection();
                });
            });
        }

        // Step 2 — Location
        function setupLocationSelection() {
            cloneAndReplace('.location-option');
            selectedLocation              = null;
            submitButton.style.display    = 'none';
            locationWarning.style.display = 'none';

            document.querySelectorAll('.location-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.location-option').forEach(o => o.classList.remove('selected'));
                    option.classList.add('selected');
                    selectedLocation = option.dataset.location;

                    submitButton.style.display    = 'inline-block'; // Step 3 unlocked
                    locationWarning.style.display = 'none';
                    displayTimeMessage('');
                });
            });
        }

        // QR Code
        function generateQRCode(data) {
            const container = document.getElementById('qrcode');
            if (!container) return;
            container.innerHTML = '';

            const qrData = {
                employeeId:     data.employeeId     || '',
                orderDate:      typeof data.orderDate === 'string' ? data.orderDate :
                                data.orderDate instanceof Date     ? data.orderDate.toISOString() :
                                data.orderDate?.toDate?.()?.toISOString() ?? new Date().toISOString(),
                orderTimestamp: data.orderTimestamp  || new Date().toISOString(),
                orderStatus:    data.orderStatus     || 'ordered',
                mealSet:        data.mealSet         || '',
                location:       data.location        || ''
            };

            // Render colour-coded badges in popup
            displayOrderInfo(data.location, data.mealSet);

            try {
                new QRCode(container, {
                    text: JSON.stringify(qrData),
                    width: 200, height: 200,
                    colorDark: "#000000", colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                const btn = document.getElementById('downloadQR');
                if (btn) {
                    btn.style.display = 'block';
                    btn.onclick = () => {
                        const canvas = container.querySelector('canvas');
                        if (canvas) {
                            const a = document.createElement('a');
                            a.href     = canvas.toDataURL("image/png");
                            a.download = `order-qr-${Date.now()}.png`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        }
                    };
                }
            } catch (e) { console.error("QR error:", e); }
        }

        // Duplicate order check
        async function checkPreviousOrder(userID, collectionRef) {
            try {
                const now   = await getCurrentServerTime();
                const start = new Date(now); start.setHours(0,  0,  0,   0);
                const end   = new Date(now); end.setHours(23, 59, 59, 999);
                const q     = query(collectionRef,
                                    where("userId",    "==", userID),
                                    where("orderDate", ">=", Timestamp.fromDate(start)),
                                    where("orderDate", "<=", Timestamp.fromDate(end)));
                const snap  = await getDocs(q);
                return snap.empty;
            } catch { return true; }
        }

        // Process order
        async function processOrder(userID) {
            try {
                if (!selectedMealSet || !['A', 'B'].includes(selectedMealSet)) {
                    alert("Session error: meal set not selected. The page will now refresh — please try again.");
                    location.reload();
                    return;
                }

                if (!selectedLocation?.trim()) {
                    locationWarning.style.display = 'block';
                    alert("Session error: location not selected. The page will now refresh — please try again.");
                    location.reload();
                    return;
                }

                const timeStatus = await isOrderingTime();
                if (!timeStatus.isValid) { alert("Order is closed. Please order between 4 AM – 10 AM or 4 PM – 9 PM."); return; }

                const canOrder = await checkPreviousOrder(userID, collection(db, "orders"));
                if (!canOrder) { alert("You have already placed an order today."); return; }

                overlay.style.display        = 'block';
                loadingSpinner.style.display = 'block';

                const userDoc = await getDoc(doc(db, "users", userID));
                if (!userDoc.exists()) throw new Error("User not found");

                const orderRef  = await addDoc(collection(db, "orders"), {
                    ...userDoc.data(),
                    orderDate:   serverTimestamp(),
                    userId:      userID,
                    orderStatus: "ordered",
                    mealSet:     selectedMealSet,
                    location:    selectedLocation
                });

                const snap               = await getDoc(orderRef);
                const orderWithTimestamp = { ...snap.data(), id: orderRef.id };

                thankYouMessage.style.display   = 'block';
                submitButton.style.display      = 'none';
                locationSelection.style.display = 'none';
                mealSetsContainer.style.display = 'none';
                generateQRCode(orderWithTimestamp);
                storeOrderData(orderWithTimestamp);

            } catch (error) {
                console.error("Order error:", error);
                alert("There was an error processing your order. Please try again.");
                thankYouMessage.style.display = 'none';
            } finally {
                overlay.style.display        = 'none';
                loadingSpinner.style.display = 'none';
            }
        }

        // Yes click — Step 1 → 2 → 3 flow
        window.handleYesClick = async function () {
            const user = auth.currentUser;
            if (!user) { alert("Please log in to continue"); return; }

            const timeStatus = await isOrderingTime();
            if (!timeStatus.isValid) {
                displayTimeMessage("Order is closed. Please order between 4 AM – 10 AM or 4 PM – 9 PM.");
                submitButton.style.display      = 'none';
                locationSelection.style.display = 'none';
                mealSetsContainer.style.display = 'none';
                return;
            }

            const canOrder = await checkPreviousOrder(user.uid, collection(db, "orders"));
            if (!canOrder) {
                displayTimeMessage("You have already placed an order today.");
                submitButton.style.display      = 'none';
                locationSelection.style.display = 'none';
                mealSetsContainer.style.display = 'none';
                return;
            }

            resetSelections();  
            mealSetsContainer.style.display = 'block';
            displayTimeMessage('Please select your meal set (A or B).');
            setupMealSetSelection();
        };

        // No click
        window.handleNoClick = async function () {
            const user = auth.currentUser;
            if (!user) { alert("Please log in to continue"); return; }

            const timeStatus = await isOrderingTime();
            if (!timeStatus.isValid) {
                displayTimeMessage("'No Eating' submission is only available during ordering hours (4 AM – 10 AM, 4 PM – 9 PM).");
                return;
            }

            const noEatingCol = collection(db, "noEating");
            const canSubmit   = await checkPreviousOrder(user.uid, noEatingCol);
            if (!canSubmit) { alert("You have already submitted a 'No Eating' entry today."); return; }

            const dialog = document.createElement('div');
            dialog.innerHTML = `
                <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;justify-content:center;align-items:center;">
                    <div style="background:white;padding:20px;border-radius:10px;text-align:center;">
                        <p style="margin-bottom:20px;">Are you sure you don't want to order food today?</p>
                        <button id="confirmYes" style="margin:0 10px;padding:8px 16px;background:#4CAF50;color:white;border:none;border-radius:4px;cursor:pointer;">Yes</button>
                        <button id="confirmNo"  style="margin:0 10px;padding:8px 16px;background:#f44336;color:white;border:none;border-radius:4px;cursor:pointer;">No</button>
                    </div>
                </div>`;
            document.body.appendChild(dialog);

            const confirm = async (yes) => {
                if (yes) {
                    try {
                        overlay.style.display        = 'block';
                        loadingSpinner.style.display = 'block';
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (!userDoc.exists()) throw new Error("User not found");
                        await addDoc(noEatingCol, { ...userDoc.data(), userId: user.uid, noEatingDate: serverTimestamp() });
                        alert('Thank you for letting us know!');
                        window.location.href = 'home.html';
                    } catch (e) {
                        console.error(e);
                        alert("There was an error. Please try again.");
                    } finally {
                        overlay.style.display        = 'none';
                        loadingSpinner.style.display = 'none';
                    }
                }
                dialog.remove();
            };

            dialog.querySelector('#confirmYes').addEventListener('click', () => confirm(true));
            dialog.querySelector('#confirmNo').addEventListener('click',  () => confirm(false));
        };

        function resetSelections() {
            selectedMealSet  = null;
            selectedLocation = null;
            document.querySelectorAll('.meal-set-option').forEach(o => o.classList.remove('selected'));
            document.querySelectorAll('.location-option').forEach(o => o.classList.remove('selected'));  // ← this line is the fix
            submitButton.style.display      = 'none';
            locationSelection.style.display = 'none';
            locationWarning.style.display   = 'none';
            displayTimeMessage('');
        }

        // Restore today's QR from localStorage
        async function checkAndDisplayExistingOrder() {
            if (!await isStoredOrderFromToday()) return;
            try {
                const raw  = localStorage.getItem('orderData');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (!data) return;
                thankYouMessage.style.display   = 'block';
                submitButton.style.display      = 'none';
                locationSelection.style.display = 'none';
                mealSetsContainer.style.display = 'none';
                setTimeout(() => {
                    if (document.getElementById('qrcode')) generateQRCode(data);
                }, 500);
            } catch (e) { console.error("Restore error:", e); }
        }

        if (submitButton) {
            submitButton.addEventListener("click", () => {
                if (!selectedMealSet || !['A', 'B'].includes(selectedMealSet)) {
                    alert("Session error: meal set not selected. The page will now refresh — please try again.");
                    location.reload();
                    return;
                }
                if (!selectedLocation?.trim()) { locationWarning.style.display = 'block'; alert("Please select your eating location."); return; }
                const user = auth.currentUser;
                if (user) { processOrder(user.uid); }
                else { alert("Please log in to place an order"); }
            });
        }

        // Auth + Init
        auth.onAuthStateChanged((user) => { if (user) checkAndDisplayExistingOrder(); });

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof QRCode === 'undefined') {
                const s  = document.createElement('script');
                s.src    = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
                s.onload = async () => await updateCalendarDisplay();
                document.head.appendChild(s);
            } else {
                await updateCalendarDisplay();
            }
        });

        // Midnight cleanup
        setInterval(async () => {
            const now = await getCurrentServerTime();
            const eod = new Date(now); eod.setHours(23, 59, 59, 999);
            if (now >= eod && !await isStoredOrderFromToday()) { clearStoredOrderData(); location.reload(); }
        }, 60000);
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const page  = window.location.pathname.split('/').pop() || 'home.html';
            const items = document.querySelectorAll('.nav-container .nav-item');
            items.forEach(item => item.classList.remove('active'));
            items.forEach(item => { if (item.getAttribute('href') === page) item.classList.add('active'); });
        });
    </script>
</body>
</html>
